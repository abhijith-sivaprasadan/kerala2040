version: 1
classification: source_scoped_three_workstream_gis_review_not_validated_geometry
review_date: "2026-09-20"
geography: Kerala
official_public_acquisition_manifest: data/evidence/gis/official_gis_public_acquisition_2026_09_20.json
public_acquisition_workflow: https://github.com/abhijith-sivaprasadan/kerala2040/actions/runs/35504312456
raw_artifacts_uncommitted: true
source_registry:
  kerala_forest:
    organisation: Kerala Forest and Wildlife Department
    url: https://forest.kerala.gov.in/
    note: Department reports digitised reserve forest and protected area boundary layers; no verified public machine-readable download identified.
  kerala_forest_gis_report:
    organisation: Kerala Forest and Wildlife Department
    url: https://forest.kerala.gov.in/images/abc/AR_Book_2022.pdf
    note: Source report describes its in-house digital forest and protected-area boundary data, not file delivery.
  kerala_ksdi:
    organisation: Kerala State Spatial Data Infrastructure
    url: https://eitd.kerala.gov.in/en/kerala-state-spatial-data-infrastructure/
    note: State-wide data-sharing geoportal route, not an authenticated exclusion geometry.
  ksdma_hazard:
    organisation: Kerala State Disaster Management Authority
    url: https://sdma.kerala.gov.in/hazard-maps/
    note: Official GSI 2022 landslide district shapefile download links; NCESS 2010 superseded.
  nrsc_cartodem:
    organisation: NRSC / ISRO Bhuvan
    url: https://bhuvan-app3.nrsc.gov.in/data/download/help/source/html/steps_to_download_data.htm
    note: CartoDEM 1-arcsecond tile selection and download require user login; published download limit applies.
  copernicus_dem:
    organisation: Copernicus Programme / Sinergise
    url: https://registry.opendata.aws/copernicus-dem/
    technical_readme: https://copernicus-dem-30m.s3.amazonaws.com/readme.html
    note: GLO-30 and GLO-90 are digital SURFACE models, not bare-earth DTMs; 2021 release, COG tiles via public AWS.
  swak:
    organisation: State Wetland Authority Kerala
    url: https://envt.kerala.gov.in/state-wetland-authority-kerala-swak/
    note: Authority for notification and wetland inventory; registry/draft/notified boundaries and influence zones require separate version checks.
  swak_briefs:
    organisation: State Wetland Authority Kerala
    url: https://www.swak.kerala.gov.in/index.php/wetland-notification-in-kerala/draft-brief-documents-of-wetlands
    note: DRAFT briefs must not be treated as legally final notification polygons.
  swak_wiams:
    organisation: State Wetland Authority Kerala
    url: https://wiams.kerala.gov.in/
    note: Wetland Inventory Assessment and Monitoring Systems portal login is not a downloaded vector dataset.
  sac_nwia:
    organisation: ISRO Space Applications Centre
    url: https://vedas.sac.gov.in/en/National_Wetland_Inventory_and_Assessment_%28NWIA%29_Atlas.html
    note: Kerala NWIA atlas is a PDF/background map; not a supplied GIS geometry or 2024-25 legal wetland boundary.


version: 2
classification: reconciled_structural_base_not_dispatch_ready
base_date: "2026-03-31"
timezone: Asia/Kolkata
purpose: >-
  Canonical physical starting boundary for the full Kerala2040 PyPSA programme.
  Renewable capacity uses MNRE's same-date location-based 31 March 2026 table.
  Thermal capacity is retained from the official Kerala/CEA planning evidence at the
  same 536.54 MW physical in-state level. This is not yet a dispatch-ready network.

source_priority:
  renewable_location_base:
    id: mnre_2026_03_31_location_based_re
    publisher: Ministry of New and Renewable Energy
    title: State-wise (Location based) installed capacity of Renewable Power as on 31.03.2026
    url: https://cdnbbsr.s3waas.gov.in/s3716e1b8c6cd17b771da77391355749f3/uploads/2026/04/20260415955675604.pdf
    boundary_date: "2026-03-31"
    rule: authoritative technology split for Kerala renewable capacity at the base date
  thermal_base:
    id: cea_kerala_resource_adequacy_2026
    publisher: Central Electricity Authority / Kerala resource-adequacy evidence
    boundary_date: "2026-03-31"
    thermal_mw: 536.54
    rule: physical Kerala thermal capacity; do not substitute allocation-based state tables
  historical_crosscheck:
    id: economic_review_2025
    boundary_date: "2025-03-31"
    file: configs/observed_2024_25.yaml
  later_update:
    id: mnre_aug2026_re
    boundary_date: "2026-08-31"
    file: data/evidence/assets/kerala_energy_asset_register_2026_09_25.json
    rule: later evidence is an overlay only and is never silently merged into the March base

capacity_boundary_mw:
  thermal: 536.54
  renewable_location_based:
    large_hydro: 2008.15
    small_hydro: 276.52
    hydro_total: 2284.67
    wind: 71.52
    bio_power:
      biomass_non_bagasse: 2.27
      waste_to_energy_off_grid: 0.23
      total: 2.50
    solar:
      ground_mounted: 340.26
      rooftop_including_pm_surya_ghar: 1850.40
      hybrid_component: 0.00
      off_grid_or_kusum_component_b: 24.93
      total: 2215.59
    total: 4574.28
  physical_capacity_total_mw: 5110.82
  arithmetic_rule: thermal + MNRE location-based renewable total

historical_ownership_crosscheck_2025_03_31:
  status: prior_year_only_not_2026_ownership_allocation
  state_mw: 2409.77
  central_mw: 359.58
  private_mw: 1642.79
  rule: >-
    These ownership totals are retained only as a 31 March 2025 crosscheck. They are
    not forced to reconcile the 31 March 2026 technology totals without a same-date
    ownership register.

named_asset_crosschecks:
  thermal:
    - id: ntpc_kayamkulam_rgccpp
      accounting_mw: 359.58
      ownership: central
      dispatch_ready: false
      blocker: fuel price, heat rate, availability and commercial dispatch terms unresolved
    - id: ksebl_brahmapuram_bdpp
      accounting_mw: 63.96
      ownership: state
      dispatch_ready: false
      blocker: unit availability, heat rate and fuel cost unresolved
    - id: ksebl_kozhikode_kdpp
      accounting_mw: 96.00
      ownership: state
      dispatch_ready: false
      blocker: unit availability, heat rate and fuel cost unresolved
    - id: residual_private_thermal_cpp
      accounting_mw: 17.00
      ownership: private
      dispatch_ready: false
      blocker: exact plant identity/status must be reconciled before dispatch
  solar:
    - id: ntpc_kayamkulam_floating_solar
      capacity_mw: 92.00
      status: named_component_of_340_26_mw_ground_mounted_category
      dispatch_ready: false
      blocker: hourly generation profile not yet admitted
    - id: kasargod_solar_park_confirmed
      capacity_mw: 100.00
      status: named_component_of_340_26_mw_ground_mounted_category
      dispatch_ready: false
      blocker: plant-level March-2026 mapping/profile reconciliation remains
  wind:
    - id: ksebl_kanjikode_wind
      capacity_mw: 2.03
      status: named_component_of_71_52_mw_wind_category
      dispatch_ready: false
      blocker: current full wind asset decomposition remains incomplete

distributed_solar_boundary:
  rooftop_capacity_mw: 1850.40
  off_grid_or_kusum_component_b_mw: 24.93
  source_population: MNRE location-based renewable-capacity categories at 31 March 2026
  rooftop_pypsa_treatment_default: embedded_in_net_grid_demand
  rooftop_explicit_generator_allowed: false
  off_grid_pypsa_treatment_default: excluded_from_grid_dispatch
  reason: >-
    Historical/current grid-demand observations already reflect behind-the-meter
    rooftop self-generation and exports at their measurement boundary. Existing
    rooftop capacity must not also be injected as explicit generation until gross
    demand and behind-the-meter production are reconstructed consistently.
  gross_demand_reconstruction_required_for_explicit_rooftop:
    - measured or validated rooftop PV generation profile
    - self-consumption/export treatment
    - distribution-loss boundary
    - same-date installed capacity and availability
  future_increment_rule: >-
    Incremental rooftop solar after the base date may be represented explicitly only
    with a compatible gross-demand definition, or as a documented net-load reduction.

storage_boundary:
  operational_bess_power_mw: null
  operational_bess_energy_mwh: null
  operational_psp_power_mw: null
  status: blocked_until_COD_and_physical_constraints_verified
  rule: awarded, regulator-approved or planning-study storage is pipeline, not base capacity

network_boundary:
  import_ttc_mw_snapshot: 4575
  import_atc_mw_snapshot: 4455
  snapshot_only: true
  annual_or_future_limit_admitted: false
  line_ratings_additive: false
  rule: >-
    The current TTC/ATC snapshot is a crosscheck for the base network, not an
    8760-hour import bound and not a future 2030/2035/2040 transfer assumption.

later_august_2026_renewable_overlay:
  applied_to_base: false
  as_of: "2026-08-31"
  source: MNRE location-based installed renewable capacity
  solar_mw:
    ground_mounted: 342.27
    rooftop_including_pm_surya_ghar: 2259.50
    off_grid_or_kusum_component_b: 25.07
    total: 2626.84
  wind_mw: 71.52
  bio_power_mw: 2.50
  small_hydro_mw: 276.52
  large_hydro_mw: 2008.15
  total_re_mw: 4985.53
  comparison_rules:
    - compare like-for-like MNRE categories between March and August
    - do not infer individual project COD from category growth
    - use this overlay for a later update case, not the canonical March base solve

demand_boundary:
  default: net_grid_demand_after_existing_behind_meter_generation
  historical_shape_status: measured_interval_unavailable
  current_proxy_allowed_for_research_only: true
  validated_run_requires_measured_interval: true
  demand_projection_rule: >-
    Official generation-RA, transmission-RA and CSTEP trajectories remain named
    alternatives. No averaging or silent splicing is permitted.

base_release:
  same_date_technology_capacity_reconciled: true
  asset_level_fleet_reconciled: false
  chronological_dispatch_ready: false
  capacity_expansion_ready: false
  research_assumption_run_ready: false
  validated_run_ready: false

blocking_inputs:
  - complete station/unit fleet at 2026-03-31
  - exact ground-solar, wind, small-hydro and bio-power plant decomposition
  - resolve the 17 MW private thermal CPP identity and current operating status
  - operational BESS/PSP COD evidence or explicit zero-capacity proof
  - measured interval demand, generation and actual interchange chronology
  - plant availability/outage, heat-rate and variable-cost data
  - hydro inflow/head/rule-curve/cascade constraints
  - time-varying import capability and landed import price
  - technology cost and financing selections
  - renewable hourly profiles validated against measured generation
  - reliability criterion
  - ecological capacity ceilings for expandable renewables

name: source-health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - main
    paths:
      - "src/kerala2040/sources/**"
      - "scripts/source_healthcheck.py"
      - ".github/workflows/source-health.yml"

jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install source-connector dependencies
        run: pip install -e ".[dev]"
      - name: Probe live public sources
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          DATA_GOV_RESOURCE_ID: ${{ vars.DATA_GOV_RESOURCE_ID }}
        run: python scripts/source_healthcheck.py --strict-core --json-output results/source_health.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-health
          path: results/source_health.json

name: Recover SLDC Storage gaps for Idukki v1.4

on:
  pull_request:
    paths:
      - "src/kerala2040/sldc_storage_gap_recovery.py"
      - "scripts/recover_sldc_storage_missing_days.py"
      - "tests/test_sldc_storage_gap_recovery.py"
      - ".github/workflows/recover-sldc-storage-v14.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint and unit tests
        run: |
          ruff check \
            src/kerala2040/sldc_storage_gap_recovery.py \
            scripts/recover_sldc_storage_missing_days.py \
            tests/test_sldc_storage_gap_recovery.py
          pytest -q tests/test_sldc_storage_gap_recovery.py
      - name: Retry exact missing Storage dates
        run: |
          python scripts/recover_sldc_storage_missing_days.py \
            --out results/audit/sldc_storage_gap_recovery_v14
      - name: Show compact retrieval result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("results/audit/sldc_storage_gap_recovery_v14/attempts.json")
          d = json.loads(p.read_text())
          print("control:", d["known_observed_control_status"])
          print("recovered:", d["recovered_storage_candidates"])
          print("not_recovered:", d["not_recovered"])
          for row in d["records"]:
              print(row["requested_date"], row["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sldc-storage-gap-recovery-v14
          retention-days: 90
          path: results/audit/sldc_storage_gap_recovery_v14/

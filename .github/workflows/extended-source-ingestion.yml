name: extended-source-ingestion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extended-source-ingestion.yml"

permissions:
  contents: write

concurrency:
  group: public-evidence-publisher
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: |
          pip install -e ".[dev]"
          pip install "cdsapi>=0.7.7"

      - name: Audit registered source endpoints
        continue-on-error: true
        run: python scripts/source_audit.py --timeout 12

      - name: Capture KSEB public project inventory
        continue-on-error: true
        run: python scripts/ingest_kseb_pms.py

      - name: Capture KSDMA hazard-layer catalog
        continue-on-error: true
        run: python scripts/ingest_ksdma_hazards.py

      - name: Ingest Grid-India Kerala daily PSP cross-check
        continue-on-error: true
        run: >-
          python scripts/ingest_grid_india_psp.py
          --start 2024-04-01 --end 2025-03-31
          --state Kerala --allow-insecure-tls-fallback
          --delay-seconds 0.12
          --output data/processed/grid_india_psp.parquet

      # ERA5 is acquired in the dedicated bounded source-only workflow.
      # Never overwrite the public evidence snapshot with an unchecked partial
      # manifest from this multi-source ingestion job.

      - name: Refresh published evidence before merging this acquisition
        if: always()
        run: git pull --ff-only origin main
      - name: Build public evidence bundle
        if: always()
        run: python scripts/build_web_bundle.py

      - name: Validate combined evidence
        run: python scripts/build_site.py --check
      - name: Commit public evidence bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "Public web bundle is unchanged."
          else
            git commit -m "Update extended source evidence [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-source-evidence
          retention-days: 14
          path: |
            results/source_audit.json
            data/processed/kseb_pms_projects.json
            data/processed/ksdma_hazard_manifest.json
            data/processed/grid_india_psp.parquet
            data/processed/grid_india_psp.failures.json
            data/processed/era5_daily_manifest.json
            data/raw/era5/*.nc
            public/*.json

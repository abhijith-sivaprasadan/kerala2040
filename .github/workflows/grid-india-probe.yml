name: grid-india-probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/kerala2040/sources/grid_india.py"
      - "scripts/ingest_grid_india_psp.py"
      - ".github/workflows/grid-india-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Parse official Kerala PSP samples
        run: >-
          python scripts/ingest_grid_india_psp.py
          --start 2025-03-28 --end 2025-03-31
          --state Kerala --allow-insecure-tls-fallback
          --output results/grid_india_kerala_sample.parquet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-india-kerala-probe
          path: results/grid_india_kerala_sample*

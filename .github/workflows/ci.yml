name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,geo]" "cairosvg>=2.7,<3"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dashboard contract tests
        run: node --test tests/web.test.cjs
      - name: Package dashboard
        run: python scripts/build_site.py


  browser:
    name: Packaged site Chromium smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install site-only build dependencies
        run: python -m pip install "pyyaml>=6,<7" "cairosvg>=2.7,<3"
      - name: Install a real Chromium browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build the same audited publication as GitHub Pages
        env:
          PYTHONPATH: src
        run: python scripts/build_site.py --output _site
      - name: Test complete desktop and mobile user journeys
        env:
          SITE_BASE_URL: http://127.0.0.1:8765/
          SITE_SCREENSHOT_DIR: site-browser-artifacts
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory _site > site-browser-artifacts-server.log 2>&1 &
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/site.browser.cjs
      - name: Preserve audited site screenshots and local server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kerala2040-site-browser-evidence
          path: |
            site-browser-artifacts/
            site-browser-artifacts-server.log
          if-no-files-found: warn

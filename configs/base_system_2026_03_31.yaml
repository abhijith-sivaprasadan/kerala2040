  primary_base:
    id: cea_transmission_ra_2034_35
    publisher: Central Electricity Authority
    title: Resource Adequacy Plan for Transmission System of Kerala up to 2034-35
    url: https://cea.nic.in/wp-content/uploads/2021/03/Kerela_RA_Plan.pdf
    boundary_date: "2026-03-31"
  historical_crosscheck:
    id: economic_review_2025
    boundary_date: "2025-03-31"
    file: configs/observed_2024_25.yaml
  later_update:
    id: mnre_aug2026_re
    boundary_date: "2026-08-31"
    file: data/evidence/assets/kerala_energy_asset_register_2026_09_25.json
    rule: later evidence is an overlay only and is never silently merged into the March base


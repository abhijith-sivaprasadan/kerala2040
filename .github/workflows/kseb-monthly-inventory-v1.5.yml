name: KSEB monthly reservoir inventory v1.5

on:
  pull_request:
    paths:
      - "data/evidence/hydro/kseb_monthly_reservoir_inventory_fy2024_25_2026_09_26.json"
      - "docs/IDUKKI_V1_5_KSEB_MONTHLY_SOURCE_INVENTORY_2026_09_26.md"
      - "scripts/audit_kseb_monthly_reservoir_files_v1_5.py"
      - "tests/test_kseb_monthly_reservoir_files_v1_5.py"
      - ".github/workflows/kseb-monthly-inventory-v1.5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monthly-source-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint and focused tests
        run: |
          ruff check \
            scripts/audit_kseb_monthly_reservoir_files_v1_5.py \
            tests/test_kseb_monthly_reservoir_files_v1_5.py
          pytest -q tests/test_kseb_monthly_reservoir_files_v1_5.py
      - name: Validate inventory-only gate
        run: |
          python scripts/audit_kseb_monthly_reservoir_files_v1_5.py \
            --out results/hydro/kseb_monthly_file_audit_v1_5.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path(
                  "results/hydro/kseb_monthly_file_audit_v1_5.json"
              ).read_text()
          )
          assert result["files_supplied"] == 0
          assert len(result["months_missing"]) == 12
          assert result["complete_12_month_byte_set"] is False
          assert result["content_parser_selected"] is False
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kseb-monthly-reservoir-v1.5-INVENTORY-GATE
          retention-days: 90
          path: results/hydro/kseb_monthly_file_audit_v1_5.json

# Green means the official 12-month inventory and local-byte fingerprint gate are
# internally consistent. It does not mean the 12 source files have been acquired.

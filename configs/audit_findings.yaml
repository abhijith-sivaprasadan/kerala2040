version: 1
classification: audit_tracking_not_model_input
scope: Kerala statewide FY2024-25 historical calibration and 2040 planning
policy: >-
  A code implementation, a source catalogue, or a successful solver run does not
  demonstrate completed data acquisition or a validated scientific result.
  The checks below use only evidence committed in this research repository.
  Workflow artifacts, local files and private agency data require separate review.
sources:
  sldc_request: docs/SLDC_DATA_REQUEST_DRAFT.md
  sldc_missing_dates_request: docs/SLDC_MISSING_11_REQUEST_DRAFT.md
  cstep_2016_request: docs/CSTEP_FY2016_DATA_REQUEST_DRAFT.md
  audit_roadmap: docs/MODELLING_DATA_ROADMAP.md
  interval_electricity_review: docs/INTERVAL_ELECTRICITY_SOURCE_REVIEW.md
  generator_register_review: docs/GENERATOR_REGISTER_FY2024_25_RECONCILIATION.md
  generator_unit_crosschecks: configs/generator_reconciliation_2024_25.yaml
  hydro_topology_evidence: configs/hydro_topology_evidence_2024_25.yaml
  hydro_operations_audit: docs/HYDRO_RESERVOIR_OPERATIONS_AUDIT.md
  grid_transfer_review: docs/GRID_TRANSFER_CONTRACTS_FY2024_25_AUDIT.md
  grid_transfer_source_registry: configs/grid_transfer_contract_evidence_2024_25.yaml
  project_qa: data/external/sldc_fy2024_25/qa_report.json
  era5_manifest: public/era5-daily-manifest.json
  gis_catalogue: configs/gis_inputs.yaml
  lulc_native_acquisition: configs/lulc_native_acquisition_2024_25.yaml
  lulc_source_review: docs/NRSC_LULC_NATIVE_ACQUISITION_AUDIT.md
  three_gis_source_review: docs/FOREST_DEM_WETLANDS_LANDSLIDE_GIS_AUDIT.md
  three_gis_workstreams: configs/gis_forest_dem_wetlands_hazards_2026.yaml
  economics_registry: configs/techno_economics.yaml

findings:
  - id: sldc_missing_days
    priority: P0
    check: sldc_daily_coverage
    acquisition: >-
      Eleven FY2024-25 reports remain unverified. Public historical-form retry on
      19 September 2026 yielded no verifiable dated reports; 13 August 2024
      successfully matched the existing observed-day control. Request the
      eleven original five-section reports from SLDC; do not impute missing days.
    evidence: data/external/sldc_fy2024_25/qa_report.json
  - id: measured_interval_demand_interchange
    priority: P0
    check: measured_interval
    acquisition: >-
      Public-source review confirms CEA analysed FY2024-25 hourly Kerala demand and
      SRPC publishes official Kerala DSM actual-drawal accounting, but the repository
      still lacks the complete authenticated interval demand plus actual-interchange
      chronology. Request the SLDC/KSEBL export and acquire/reconcile SRPC blockwise
      DSM data files without substituting schedules or published charts for telemetry.
    evidence: docs/INTERVAL_ELECTRICITY_SOURCE_REVIEW.md
  - id: generator_register
    priority: P0
    check: generator_assets
    acquisition: >-
      FY2024-25 KSEBL/CEA crosschecks establish Thottiyar (40 MW) and Pallivasal
      Extension (60 MW) commissioning despite the project portal marking both
      ongoing. Two name-embedded kW values conflict with the portal MW fields;
      70 of 87 portal items are captured. Still reconcile the full KSEBL and
      non-KSEBL fleet, actual plant generation, outages, fuel, retirement and
      ownership against the dated FY-end official capacity boundary.
    evidence: docs/GENERATOR_REGISTER_FY2024_25_RECONCILIATION.md
  - id: reservoir_operations
    priority: P0
    check: hydro_physics
    acquisition: >-
      Independently document and check selected Idukki, Pamba-Kakki-Sabarigiri-Kakkad,
      and Sholayar-Poringalkuthu qualitative water links against KSEBL dam records.
      SLDC has 16 reservoir rows per 354 observed days, but not a reconciled
      full network or usable water balance. Obtain measured catchment inflows,
      releases, spill, head/efficiency, rule curves and environmental flows
      before connecting storage or passing the hydro-physics release gate.
    evidence: docs/HYDRO_RESERVOIR_OPERATIONS_AUDIT.md
  - id: interstate_transfer_and_contracts
    priority: P0
    check: grid_transfer
    acquisition: >-
      Validate eight named daily SLDC import-energy interface rows across
      354 observed days. SRPC's January 2025 TTC/margin snapshot and KSEBL's
      retrospective March capability increase are not a complete FY ATC/TTC
      chronology or export rights. Obtain revision-dated import/export limits,
      N-1/ICT/HVDC constraints, actual versus scheduled intervals, and a
      commercially usable contract/deliverability register.
    evidence: docs/GRID_TRANSFER_CONTRACTS_FY2024_25_AUDIT.md
  - id: recent_lulc_georeferenced
    priority: P0
    check: gis_model_ready
    acquisition: >-
      Bhuvan displays an FY2024-25 national LULC250K map option, while the
      accessible Bhuvan Store data-for-download list stops at 2022-23 and
      ISRO describes a signed institutional MoU for native LULC250K data.
      No original Kerala class-coded raster, exact legend, CRS, source hash,
      permission or statewide geometry has been secured. Pursue authorised
      native data and finer district SISDP 10K where available; WMS imagery
      cannot be counted as categorical raster or legal siting.
    evidence: docs/NRSC_LULC_NATIVE_ACQUISITION_AUDIT.md
  - id: elevation_dem
    priority: P1
    check: gis_model_ready
    acquisition: >-
      Official CartoDEM requires Bhuvan login/tile metadata. Public Copernicus
      GLO-30/GLO-90 COGs provide DSM, not bare-earth terrain. Obtain and hash
      real Kerala tiles, verify CRS, nodata, vertical reference and full mosaic
      seam/coverage before computing technology-specific slope constraints.
    evidence: docs/FOREST_DEM_WETLANDS_LANDSLIDE_GIS_AUDIT.md
  - id: forest_protected_areas
    priority: P0
    check: gis_model_ready
    acquisition: >-
      Kerala Forest Department reports digitised reserve/protected-area
      boundaries, not a publicly acquired current notified source vector.
      Request official GPKG/shapefiles, legal categories, gazette IDs,
      effective dates, CRS, revisions and redistribution permission.
    evidence: docs/FOREST_DEM_WETLANDS_LANDSLIDE_GIS_AUDIT.md
  - id: wetland_waterbody_landslide
    priority: P0
    check: gis_model_ready
    acquisition: >-
      Request SWAK current wetland inventory, final-notification polygons,
      draft outlines, waterbodies and influence zones separately. All 13
      KSDMA-hosted GSI 2022 district ZIPs are now hash-verified and decoded:
      39 EPSG:32643 MultiPolygons, three per district, with source field
      Susceptibi = Low/Moderate/High. All 39 fail OGC validity through ring
      self-intersection, so no merged hazard overlay is admitted until a
      documented geometry-repair/topology policy is validated. Alappuzha is
      absent from the published package set and is not inferred hazard-free.
      Do not use superseded NCESS or turn susceptibility into an automatic
      legal exclusion.
    evidence: docs/FOREST_DEM_WETLANDS_LANDSLIDE_GIS_AUDIT.md
  - id: niwe_wind_resource
    priority: P1
    check: gis_model_ready
    acquisition: NIWE wind raster, metadata, usage terms and turbine conversion assumptions.
    evidence: configs/gis_inputs.yaml
  - id: substations_lines_geospatial
    priority: P1
    check: gis_model_ready
    acquisition: Permitted georeferenced substations, lines and connection constraints.
    evidence: docs/MODELLING_DATA_ROADMAP.md
  - id: era5_full_weather_year
    priority: P1
    check: era5_complete
    acquisition: Complete FY2024-25 weather coverage with verified timestamps, units and PV/wind transformations.
    evidence: public/era5-daily-manifest.json
  - id: technology_costs_finance
    priority: P0
    check: technology_costs
    acquisition: Dated harmonised 2040 capex/O&M, BESS MW/MWh, lifetime, financing and source-specific prices.
    evidence: configs/techno_economics.yaml
  - id: import_tariffs_and_prices
    priority: P0
    check: grid_transfer
    acquisition: >-
      Reconcile dated KSERC-approved versus KSEBL actual station/bilateral/DEEP/
      swap/market procurement, delivery profiles, obligations, transmission
      charges and landed INR/MWh by cost year; avoid treating post-FY PPAs,
      exchange-clearing prices or nameplate MW as FY2024-25 delivered energy.
    evidence: docs/GRID_TRANSFER_CONTRACTS_FY2024_25_AUDIT.md
  - id: kmml_material_chemistry
    priority: P2
    check: kmml_measured
    acquisition: KMML throughput, waste/residual quantities, chemistry, baseline treatment, recovery yield and offtake.
    evidence: docs/KMML_CASE_PLAN.md
  - id: kmml_energy_water
    priority: P2
    check: kmml_measured
    acquisition: KMML process electricity, heat, water and effluent time series with metering boundary and publication terms.
    evidence: docs/KMML_CASE_PLAN.md
  - id: cstep_2016_raw_interval
    priority: P1
    check: cstep_raw_2016
    acquisition: Recover source FY2016 observed 15-minute chronology, not digitisation of a published curve.
    evidence: docs/CSTEP_FY2016_DATA_REQUEST_DRAFT.md

release_gates:
  daily_accounting:
    required: [sldc_accounting_integrity]
    description: Only verified daily accounting; 354 observed days must be displayed explicitly.
  observed_full_year:
    required: [sldc_daily_coverage, measured_interval]
    description: No gap-fill or proxy may pass as measured full-year chronology.
  ecological_capacity_ceiling:
    required: [gis_model_ready]
    description: Catalogue files and downloaded GIS archives are not screened eligible land.
  techno_economic_2040:
    required: [technology_costs, grid_transfer, hydro_physics, generator_assets, gis_model_ready, era5_complete, measured_interval]
    description: 2040 capacity expansion needs all verified physical, economic and chronology gates.
  kmml_case:
    required: [kmml_measured]
    description: No numerical KMML industrial result without a measured process boundary.

name: Full PyPSA proxy expansion v0.8

on:
  pull_request:
    paths:
      - "configs/full_pypsa_proxy_expansion_v0_8.yaml"
      - "configs/full_pypsa_future_adequacy_v0_4.yaml"
      - "configs/full_pypsa_cost_finance_v0_5.yaml"
      - "configs/full_pypsa_era5_renewable_profiles_v0_6.yaml"
      - "configs/full_pypsa_renewable_capacity_v0_7.yaml"
      - "src/kerala2040/full_pypsa_proxy_expansion.py"
      - "src/kerala2040/full_pypsa_future_adequacy.py"
      - "src/kerala2040/full_pypsa_cost_finance.py"
      - "src/kerala2040/full_pypsa_renewable_capacity.py"
      - "src/kerala2040/era5_renewable_profiles.py"
      - "scripts/run_full_pypsa_proxy_expansion_v0_8.py"
      - "scripts/build_full_pypsa_era5_profiles_v0_6.py"
      - "tests/test_full_pypsa_proxy_expansion_v0_8.py"
      - ".github/workflows/full-pypsa-proxy-expansion-v0.8.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run-proxy-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install modelling and ERA5 dependencies
        run: python -m pip install -e ".[dev,era5]"

      - name: Lint and unit-test v0.8
        run: |
          ruff check \
            src/kerala2040/full_pypsa_proxy_expansion.py \
            scripts/run_full_pypsa_proxy_expansion_v0_8.py \
            tests/test_full_pypsa_proxy_expansion_v0_8.py
          pytest -q tests/test_full_pypsa_proxy_expansion_v0_8.py

      - name: Download verified Apr-Dec 2024 ERA5 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35622527064"
          pattern: era5-*-2024-*_to_2024-*-SOURCE-UNVALIDATED
          path: results/acquisition/era5/full-year-input/2024
          merge-multiple: false

      - name: Download verified Jan-Mar 2025 ERA5 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35623051780"
          pattern: era5-*-2025-01_to_2025-03-REACQUIRED-UNVALIDATED
          path: results/acquisition/era5/full-year-input/2025
          merge-multiple: false

      - name: Require exactly 20 independent location-quarter artifacts
        shell: bash
        run: |
          set -euo pipefail
          count="$(find results/acquisition/era5/full-year-input \
            -type f -name retrieval_attempt.json | wc -l)"
          echo "retrieval manifests: $count"
          test "$count" -eq 20

      - name: Rebuild verified v0.6 hourly renewable screening profiles
        run: |
          python scripts/build_full_pypsa_era5_profiles_v0_6.py \
            results/acquisition/era5/full-year-input

      - name: Run full 8,760-hour v0.8 proxy expansion suite
        run: |
          python scripts/run_full_pypsa_proxy_expansion_v0_8.py \
            --acknowledge-proxy \
            --hours 8760

      - name: Show compact v0.8 result table
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(
              Path("results/models/full_pypsa/proxy_expansion_v0_8/summary.json").read_text()
          )
          for row in data["cases"]:
              print(
                  row["demand_case"],
                  row["transfer_case"],
                  row["capacity_envelope_case"],
                  row["bess_cost_case"],
                  "shortage_MWh=", round(row["stage2_unserved_mwh"], 3),
                  "solar_MW=", round(row["built"]["solar_combined_mw"], 3),
                  "wind_MW=", round(row["built"]["wind_onshore_mw"], 3),
                  "bess_MW=", round(row["built"]["bess_4h_power_mw"], 3),
                  "annual_cost_mINR=", round(
                      row["annualized_candidate_investment_million_inr_per_year"], 3
                  ),
              )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: full-pypsa-proxy-expansion-v0.8-NOT-VALIDATED
          retention-days: 90
          if-no-files-found: error
          path: |
            results/models/full_pypsa/era5_renewables_v0_6/statewide_equal_weight_profile.parquet
            results/models/full_pypsa/proxy_expansion_v0_8/summary.json

# Adequacy-first proxy only. Import economics, statutory siting, spatial grid hosting,
# operational outages and validated hydro physics remain unresolved.

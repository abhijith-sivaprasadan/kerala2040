load_chronology:
  report_page: 33
  classification: published_external_scenario
  key_statement: CSTEP analysed observed Kerala 15-minute data for FY2016, derived an FY2022 load curve, then extrapolated the shape to FY2040.
  raw_fy2016_series_in_report: false
  acquisition_priority: critical
  acquisition_targets:
    - CSTEP
    - Energy Management Centre Kerala
    - KSEBL
    - Kerala SLDC
  use_rule: Do not digitise the plotted curve and call it measured telemetry. The underlying FY2016 15-minute series must be acquired separately.


name: Audit FY2024-25 hydro operations evidence

on:
  pull_request:
    paths:
      - "configs/hydro_topology_evidence_2024_25.yaml"
      - "scripts/audit_hydro_operations.py"
      - "tests/test_hydro_operations.py"
      - "data/external/sldc_fy2024_25/**"
      - ".github/workflows/hydro-operations-evidence.yml"
  push:
    branches: [main]
    paths:
      - "configs/hydro_topology_evidence_2024_25.yaml"
      - "scripts/audit_hydro_operations.py"
      - "data/external/sldc_fy2024_25/**"
      - ".github/workflows/hydro-operations-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-dated-source-and-qualitative-links:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only hydro evidence audit dependencies
        run: pip install "pyyaml>=6,<7" "pytest>=8,<9" "ruff>=0.7,<1"
      - name: Validate physical-source boundaries and regression tests
        run: |
          ruff check scripts/audit_hydro_operations.py tests/test_hydro_operations.py
          pytest -q tests/test_hydro_operations.py
          python scripts/audit_hydro_operations.py
      - name: Keep operational calibration explicitly blocked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("results/hydro/operations_evidence.json").read_text())
          assert result["reservoir_rows"] == 5664
          assert result["observed_dates"] == 354
          assert result["qualitative_topology"]["documented_qualitative_links"] == 9
          assert result["water_balance_reconciled"] is False
          assert result["cascade_energy_allocation_allowed"] is False
          assert result["pypsa_connected_hydro_stores_allowed"] is False
          assert result["audit_gate_closed"] is False
          PY
      - name: Preserve source review, NOT a validated dispatch dataset
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fy24-25-hydro-qualitative-topology-NOT-CALIBRATED-DISPATCH
          path: results/hydro/operations_evidence.json
          retention-days: 90
          if-no-files-found: warn

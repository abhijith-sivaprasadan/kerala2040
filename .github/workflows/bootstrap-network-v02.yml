name: Bootstrap network v0.2 scripts
on:
  push:
    branches: [feat/kseb-public-network-v0.2-20260927]
    paths: [".github/workflows/bootstrap-network-v02.yml"]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kseb-public-network-v0.2-20260927
      - name: Decode validated scripts
        env:
          GRAPH_B64: 
          TR_B64: 
          GEN_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          files = {
            "scripts/build_kseb_public_network_graph_v0_2.py": os.environ["GRAPH_B64"],
            "scripts/promote_kseb_sld_transformers.py": os.environ["TR_B64"],
            "scripts/map_generator_census_to_public_grid.py": os.environ["GEN_B64"],
          }
          for name, blob in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              blob = "".join(blob.split())
              blob += "=" * (-len(blob) % 4)
              path.write_bytes(gzip.decompress(base64.b64decode(blob)))
          PY
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_kseb_public_network_graph_v0_2.py scripts/promote_kseb_sld_transformers.py scripts/map_generator_census_to_public_grid.py
          git commit -m "Build KSEBL public network v0.2 evidence pipeline"
          git push

name: Recheck missing FY2024-25 SLDC daily reports

on:
  push:
    paths:
      - ".github/workflows/recover-sldc-missing.yml"
      - "scripts/recover_sldc_missing_days.py"
      - "src/kerala2040/sldc_gap_recovery.py"
      - "tests/test_sldc_gap_recovery.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only source-reader dependencies
        run: python -m pip install requests pandas beautifulsoup4 lxml
      - name: Retry the eleven exact public SLDC dates
        run: python scripts/recover_sldc_missing_days.py --pause 0.8
      - name: Fail closed on retry results, keep historical baseline unchanged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          qa=json.loads(Path("data/external/sldc_fy2024_25/qa_report.json").read_text())
          report=json.loads(Path("results/acquisition/sldc_missing_dates/attempts.json").read_text())
          assert report["classification"] == "primary_source_retrieval_attempt_not_validated_dataset"
          assert report["requested_missing_dates"] == qa["missing_dates"]
          assert len(report["records"]) == 11
          assert report["original_archive_updated"] is False
          assert report["official_observed_day_coverage_changed"] is False
          assert report["audit_gate_closed"] is False
          assert report["known_observed_control_status"] in (
              "confirmed","observed_metrics_mismatch","not_retrieved"
          )
          assert report["recovered_generation_candidates"] + report["not_recovered"] == 11
          assert all(row["status"] in ("generation_candidate_only","not_recovered")
                     for row in report["records"])
          print("SLDC_RECHECK_VERIFIED=" + json.dumps({
              "generation_candidates":report["recovered_generation_candidates"],
              "not_recovered":report["not_recovered"],
              "control":report["known_observed_control_status"],
              "official_observed_days":qa["observed_days"],
              "audit_gate_closed":report["audit_gate_closed"],
          },separators=(",",":")),flush=True)
          PY
      - name: Preserve unsuccessful attempts and verified candidates for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sldc-11-missing-date-recovery-attempts-NOT-OBSERVED-DATA
          path: results/acquisition/sldc_missing_dates/
          retention-days: 90
          if-no-files-found: warn

name: publish-historical-artifact

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: Run containing the historical baseline artifact
        required: true
        type: string
      extended_run_id:
        description: Run containing extended-source-evidence
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: public-evidence-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Download validated historical baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: kerala-fy2024-25-historical-baseline
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhijith-sivaprasadan/kerala2040
          run-id: ${{ inputs.baseline_run_id }}

      - name: Download extended source evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: extended-source-evidence
          path: extended-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: abhijith-sivaprasadan/kerala2040
          run-id: ${{ inputs.extended_run_id }}

      - name: Restore validated processed evidence
        run: |
          mkdir -p data/processed results/baseline figures/baseline results
          cp -a artifact/data/processed/. data/processed/
          cp -a artifact/results/baseline/. results/baseline/
          cp -a artifact/figures/baseline/. figures/baseline/
          if [ -d extended-artifact/data/processed ]; then
            cp -a extended-artifact/data/processed/. data/processed/
          fi
          if [ -f extended-artifact/results/source_audit.json ]; then
            cp extended-artifact/results/source_audit.json results/source_audit.json
          fi

      - name: Refresh published evidence
        run: git pull --ff-only origin main
      - name: Rebuild public data bundle
        run: python scripts/build_web_bundle.py

      - name: Verify connected evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          site = json.loads(Path("public/site-data.json").read_text())
          status = site["metadata"]["status"]
          assert status["sldc_daily"]["available"]
          assert status["baseline_summary"]["available"]
          assert status["reservoir_storage"]["available"]
          assert status["weather"]["available"]
          assert status["hazard_layers"]["available"]
          assert site["source_audit"] is not None
          assert site["baseline"]["calibration_gate_pass"] is True
          assert len(site["sources"]) >= 15
          print("connected layers:", sum(bool(v.get("available")) for v in status.values()))
          print("registered sources:", len(site["sources"]))
          print("baseline rows:", site["baseline"]["rows"])
          PY

      - name: Validate combined evidence
        run: python scripts/build_site.py --check
      - name: Commit rebuilt public evidence bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "Public bundle is unchanged."
          else
            git commit -m "Publish connected FY2024-25 evidence [skip ci]"
            git push
          fi

version: 1
classification: evidence_admission_registry_not_optimisation_input
prepared_date: "2026-09-25"
purpose: >-
  Map the newly acquired Kerala electricity evidence to the requirement keys used by
  the full PyPSA scenario programme. An evidence source being present does not mean
  its numerical values are automatically admitted as optimisation inputs.

sources:
  asset_register: data/evidence/assets/kerala_energy_asset_register_2026_09_25.json
  resource_adequacy: data/evidence/demand/kerala_resource_adequacy_2025_2035_36_2026_09_25.json
  historical_daily: data/external/sldc_fy2024_25/daily_balance.csv
  technology_costs: configs/techno_economics.yaml
  grid_transfer: configs/grid_transfer_contract_evidence_2024_25.yaml
  hydro_topology: configs/hydro_topology_evidence_2024_25.yaml
  solar_identity_crosswalk: data/evidence/assets/kerala_solar_ge1_identity_crosswalk_2026_03_31.json
  research_input_selection_v0_2: configs/research_input_selection_v0_2.yaml
  hydro_flexibility_bracket_v0_3: configs/full_pypsa_hydro_flexibility_v0_3.yaml
  future_adequacy_v0_4: configs/full_pypsa_future_adequacy_v0_4.yaml
  cost_finance_v0_5: configs/full_pypsa_cost_finance_v0_5.yaml
  era5_renewable_profiles_v0_6: configs/full_pypsa_era5_renewable_profiles_v0_6.yaml
  era5_renewable_profile_evidence_v0_6: data/evidence/weather/era5_renewable_profiles_v0_6_2026_09_25.json
  renewable_capacity_envelope_v0_7: configs/full_pypsa_renewable_capacity_v0_7.yaml
  pypsa_equivalence_v0_9: configs/full_pypsa_pypsa_equivalence_v0_9.yaml
  pypsa_equivalence_evidence_v0_9: data/evidence/models/full_pypsa_pypsa_equivalence_v0_9_2026_09_25.json
  proxy_expansion_v0_8: configs/full_pypsa_proxy_expansion_v0_8.yaml
  proxy_expansion_evidence_v0_8: data/evidence/models/full_pypsa_proxy_expansion_v0_8_2026_09_25.json
  wri_kerala_re_2025: data/evidence/solar/wri_kerala_re_technology_assessment_2025_09_25.json
  import_economics_v1_0: configs/full_pypsa_import_economics_v1_0.yaml
  import_economics_evidence_v1_0: data/evidence/grid/kerala_import_economics_forward_transfer_v1_0_2026_09_25.json
  hydro_dispatch_v1_1: configs/full_pypsa_hydro_dispatch_v1_1.yaml
  hydro_dispatch_evidence_v1_1: data/evidence/hydro/kerala_hydro_dispatch_boundaries_v1_1_2026_09_26.json
  hydro_dispatch_result_evidence_v1_1: data/evidence/models/full_pypsa_hydro_dispatch_v1_1_2026_09_26.json

requirements:
  base_system:
    status: structurally_reconciled_not_dispatch_ready
    evidence:
      - configs/base_system_2026_03_31.yaml
      - data/evidence/assets/kerala_energy_asset_register_2026_09_25.json
      - data/evidence/grid/kerala_transmission_resource_adequacy_2034_35_2026_09_25.json
    acquired:
      canonical_base_date_2026_03_31: true
      CEA_main_capacity_3221_30_mw_reconciled: true
      sub_1mw_solar_1912_33_mw_separate_boundary: true
      ownership_totals_reconciled: true
      august_2026_RE_kept_as_overlay: true
    remaining:
      - complete plant/unit decomposition of the March-2026 capacity population
      - operational storage status
      - unit availability and variable-operating parameters
    rule: no later snapshot may silently mutate the March-2026 canonical base

  demand_chronology:
    status: proxy_admitted_for_research_screen_not_validated
    evidence:
      - public/hourly-load-proxy-summary.json
      - data/external/sldc_fy2024_25/daily_balance.csv
    acquired:
      observed_daily_energy_354_days: true
      CEA_peak_and_duration_reference: true
      synthetic_8760_proxy: true
      v0_2_proxy_adequacy_screen_admitted: true
      v0_4_future_demand_morphed_counterfactual_admitted: true
    remaining:
      - authenticated hourly or 15-minute Kerala demand chronology
      - same-clock actual interchange and technology generation
      - daily reconciliation and boundary QA
    rule: proxy chronology may support deterministic research sensitivity only and cannot satisfy validated-run chronology

  existing_storage_fleet:
    status: blocked_operational_COD_not_verified
    evidence:
      - configs/base_system_2026_03_31.yaml
      - data/evidence/assets/kerala_energy_asset_register_2026_09_25.json
    acquired:
      awarded_BESS_pipeline: true
      PSP_planning_candidates: true
    remaining:
      - verify any operational BESS power and energy capacity at 2026-03-31
      - verify any operational pumped-storage capacity at 2026-03-31
      - COD, efficiency, degradation and availability for admitted storage
    rule: award, PPA, regulatory approval or planning assumption is not operational storage

  demand_trajectory:
    status: named_low_reference_high_families_selected
    evidence:
      - data/evidence/demand/kerala_resource_adequacy_2025_2035_36_2026_09_25.json
      - data/external/cstep_2024/demand_projection_fy2023_fy2040.csv
    acquired:
      official_CEA_KSERC_RA_2025_36: true
      CSTEP_2024: true
      lower_CSTEP_reference_CEA_KSERC_higher_CEA_transmission_families_selected: true
      higher_case_is_peak_only: true
      lower_and_reference_energy_peak_anchors_mapped_to_v0_4_counterfactual: true
    remaining:
      - acquire or define a source-bounded energy trajectory for the higher transmission-load case
      - define whether PyPSA load is gross system requirement or net grid demand after behind-the-meter generation
      - acquire measured interval chronology for shape calibration

  existing_generator_fleet:
    status: partial_station_level_hydro_thermal_wind_reconciled
    evidence:
      - data/evidence/assets/kerala_existing_fleet_2026_03_31.json
      - data/evidence/assets/kerala_re_crosswalk_2026_03_31.json
      - data/evidence/assets/kerala_solar_ge1_identity_crosswalk_2026_03_31.json
      - data/evidence/assets/kerala_energy_asset_register_2026_09_25.json
      - configs/generator_reconciliation_2024_25.yaml
    acquired:
      official_fy2024_25_aggregate_capacity: true
      canonical_CEA_2026_03_31_capacity_boundary: true
      state_hydro_station_fleet_reconciled_to_2196_36_mw: true
      state_thermal_units_reconciled_to_159_96_mw: true
      NTPC_Kayamkulam_units_reconciled_to_359_58_mw: true
      current_aug2026_location_based_RE_snapshot_overlay: true
      named_major_solar: true
      private_hydro_88_06_mw_asset_decomposition_reconciled: true
      private_thermal_PCBl_17_mw_identity_reconciled: true
      FY2024_25_private_wind_69_50_mw_asset_decomposition_reconciled: true
      March_2026_ge1_renewables_split_into_wind_and_solar_ownership_buckets: true
      March_2026_state_solar_ge1_residual_22_715_mw: true
      March_2026_private_solar_ge1_residual_214_10_mw: true
      March_2026_central_solar_92_mw_asset_identified: true
      state_solar_ge1_historical_named_seed_14_5_mw: true
      state_solar_later_identity_candidates_near_reconcile_but_not_forced: true
      private_solar_FY2024_25_IPP_204_mw_aggregate_bridge: true
      alternate_MNRE_same_date_boundary_from_PR72_preserved_not_adopted: true
      v1_1_major_hydro_station_groups_reconciled_to_2284_42MW: true
      v1_1_Idukki_130MW_single_unit_outage_anchor: true
      v1_1_daily_hydro_energy_conservation_dispatch: true
    remaining:
      - verify the FY2024-25 wind ownership split against a same-date March-2026 official unit register
      - close the remaining state solar identity/AC-MWp/overlap gap without patching 0.035 MW
      - map the private 214.10 MW CEA >=1 MW bucket to plant/project rows without mixing prosumer boundaries
      - reconcile March-2026 solar plant identities to the CEA >=1 MW ownership boundary
      - verify operational status and dispatch parameters for the 17 MW PCBL captive plant
      - plant-level actual generation and outage/derating history
      - dispatch parameters for all admitted thermal and hydro assets

  renewable_temporal_profiles:
    status: research_screening_profiles_built_not_expansion_admitted
    evidence:
      - data/evidence/assets/kerala_energy_asset_register_2026_09_25.json
      - data/evidence/weather/era5_fy2024_25_source_qa_2026_09_21.json
      - data/evidence/weather/era5_renewable_profiles_v0_6_2026_09_25.json
      - data/evidence/solar/gsa2_nwic_district_paired_seasonality_2026_09_23.json
      - data/evidence/solar/solar_wind_consolidated_numeric_2026_09_22.json
      - data/evidence/gis/niwe_nwic_district_normalized_wind_terrain_2026_09_23.json
    acquired:
      ERA5_source_chronology: true
      ERA5_20_location_quarters_reverified_in_v0_6: true
      ERA5_43800_point_hours_converted_to_hourly_weather: true
      deterministic_nearest_grid_cell_sampling: true
      five_point_PV_screening_profile_built: true
      five_point_NIWE_mean_anchored_150m_wind_screening_profile_built: true
      prior_local_proxy_regression_reproduced: true
      Kayamkulam_92MW_FY2024_25_measured_solar_generation: true
      THDC_Kasaragod_50MW_FY2024_25_measured_solar_generation: true
      GSA_long_term_solar_resource: true
      NIWE_mean_wind_resource: true
    remaining:
      - validate hourly solar shape against measured plant generation or inverter data
      - acquire usable wind generation chronology / met mast height-time metadata
      - derive capacity-weighted spatial aggregation compatible with installed/candidate fleet
      - replace generic PV/turbine assumptions with technology/site-specific models where needed
    rule: >-
      v0.6 is a reproducible source-to-profile research screen. Five equal-weight
      representative points and NIWE mean anchoring do not establish statewide
      buildable capacity or validated plant dispatch.

  solar_capacity_ceiling:
    status: published_research_envelope_ready_statutory_siting_blocked
    evidence:
      - configs/full_pypsa_renewable_capacity_v0_7.yaml
      - data/external/cstep_2024/renewable_potential_benchmarks.csv
      - data/evidence/solar/nwdp_sac_kerala_waterbodies_2026_09_22.json
      - data/evidence/solar/wri_kerala_re_technology_assessment_2025_09_25.json
    acquired:
      ground_PV_CSTEP_2423MW_screened_scenario: true
      utility_PV_WRI_DoECC_6110MW_broader_scenario: true
      floating_PV_CSTEP_920MW_scenario: true
      floating_PV_NISE_2220_5730MW_scenarios: true
      March2026_same_date_conservative_ground_existing_bridge: true
      floating_92MW_existing_asset_exact: true
      rooftop_Aug2026_installed_floor_2259_5MW: true
      rooftop_technical_ceiling: false
    remaining:
      - legal forest wetland paddy ESZ and waterbody exclusions
      - technology-specific rooftop ground floating land/water eligibility
      - grid connection and hosting constraints
      - district/site spatial allocation and source-rights admission
      - numeric rooftop technical ceiling
    rule: >-
      v0.7 values are published scenario envelopes for research sensitivity, not
      statutory buildable MW. Rooftop remains exogenous because no current
      source-bounded technical ceiling is admitted.

  wind_capacity_ceiling:
    status: published_research_envelope_ready_statutory_siting_blocked
    evidence:
      - configs/full_pypsa_renewable_capacity_v0_7.yaml
      - data/evidence/solar/nwdp_sac_kerala_waterbodies_2026_09_22.json
      - data/evidence/solar/wri_kerala_re_technology_assessment_2025_09_25.json
      - data/evidence/gis/niwe_nwic_district_normalized_wind_terrain_2026_09_23.json
    acquired:
      NIWE_2019_120m_2311MW_scenario: true
      WRI_NIWE_2621MW_benchmark: true
      CSTEP_2024_2993MW_scenario: true
      canonical_March2026_wind_71_525MW_headroom_bridge: true
    remaining:
      - turbine-specific power curve and wake layout
      - legal/ecological siting exclusions
      - setbacks roads access and grid hosting
      - eligible-area spacing/layout and district/site allocation
    rule: >-
      v0.7 wind bounds are statewide published scenario sensitivities. They do not
      convert NIWE atlas cells into project-ready MW.

  proxy_capacity_expansion_2030:
    status: adequacy_first_counterfactual_complete_not_total_system_cost_plan
    evidence:
      - configs/full_pypsa_proxy_expansion_v0_8.yaml
      - data/evidence/models/full_pypsa_proxy_expansion_v0_8_2026_09_25.json
    acquired:
      lower_FY2030_and_reference_FY2030_31_demand_cases: true
      three_ATC_sensitivities: true
      low_reference_high_RE_capacity_envelopes: true
      low_high_BESS_cost_sensitivity: true
      exact_8760_hour_sparse_LP: true
      ERA5_to_IST_clock_alignment_explicit: true
      adequacy_first_then_minimum_investment_then_minimum_import_reporting: true
      full_suite_36_cases_passed: true
    remaining:
      - landed import price and contractual/market cost chronology
      - validated existing fleet variable cost and availability
      - measured or validated hourly renewable generation and capacity weights
      - statutory/site-level renewable siting and internal grid hosting
      - reservoir/cascade hydro physics and forced outages
      - probabilistic reliability evaluation
    rule: >-
      v0.8 is a minimum-new-build adequacy counterfactual under bounded imports.
      It is not a total-system least-cost plan, investment recommendation or
      validated Kerala capacity pathway.

  battery_cost_performance:
    status: project_specific_benchmarks_partial
    evidence:
      - data/evidence/assets/kerala_energy_asset_register_2026_09_25.json
      - configs/techno_economics.yaml
    acquired:
      Mylatti_capacity_charge_and_RtE_tender_benchmark: true
      four_site_NHPC_capacity_charges: true
      power_and_energy_capacities: true
    remaining:
      - investment capex split INR_per_kW and INR_per_kWh for generic expansion
      - fixed and variable O&M treatment
      - replacement/degradation/lifetime formulation
      - charging/discharging efficiency convention and auxiliary load
      - price year and financing treatment
    rule: project tariffs are not generic BESS capex defaults

  pumped_storage_constraints:
    status: blocked
    evidence:
      - data/evidence/assets/kerala_energy_asset_register_2026_09_25.json
      - configs/hydro_topology_evidence_2024_25.yaml
    remaining:
      - verified reservoir pairs and hydraulic routes
      - upper/lower level-volume curves and usable storage
      - net head and head-dependent efficiency
      - pumping/generating MW
      - water rights rule curves environmental releases and flood headroom
      - project status and site-specific cost


  hydro_operating_representation:
    status: research_intraday_flexibility_bracket_selected_reservoir_physics_blocked
    evidence:
      - configs/full_pypsa_hydro_flexibility_v0_3.yaml
      - data/external/sldc_fy2024_25/daily_balance.csv
    acquired:
      observed_daily_hydro_energy_354_days: true
      flat_daily_average_lower_flexibility_replay: true
      exact_daily_energy_redispatch_upper_bound: true
      aggregate_installed_hydro_power_ceiling_enforced: true
    remaining:
      - station availability and outage chronology
      - reservoir storage states and rule curves
      - cascade routing travel times diversions and environmental releases
      - station-specific head efficiency minimum output and ramp constraints
      - same-clock measured hydro dispatch for validation
    rule: >-
      v0.3 brackets sensitivity to intraday hydro flexibility; the redispatch mode
      is deliberately optimistic and may not be reported as validated hydro operation

  hydrology:
    status: blocked_but_phase5_pipeline_prepared
    evidence:
      - data/evidence/sldc/idukki_hydro_energy_phase4_2026_09_23.json
    remaining:
      - verified Idukki reservoir-intercepted catchment geometry
      - multi-year area-weighted ERA5-Land catchment series
      - spill/release/diversion/evaporation data
      - head/efficiency curves and cascade routing

  interstate_transfer_limit:
    status: current_ATC_and_forward_import_requirements_selected_future_ATC_blocked
    evidence:
      - configs/grid_transfer_contract_evidence_2024_25.yaml
      - data/evidence/grid/kerala_transmission_resource_adequacy_2034_35_2026_09_25.json
      - data/evidence/grid/kerala_import_economics_forward_transfer_v1_0_2026_09_25.json
    acquired:
      jan2025_TTC_4350_RM_90_derived_ATC_4260: true
      mar2026_CEA_TTC_4575_ATC_4455: true
      v0_2_ATC_reference_4455_and_80_60pct_stress_haircuts_selected: true
      CEA_2029_30_peak_import_requirement_2696_mw: true
      CEA_2034_35_peak_import_requirement_2020_mw: true
      CEA_2029_30_ISTS_additions_2500MVA_474ckm_preserved: true
      CEA_2030_35_ISTS_additions_1000MVA_280ckm_preserved: true
    remaining:
      - effective timestamped ATC/TTC revisions for import and export
      - N_minus_1/topology/outage constraints
      - actual blockwise interchange and meter boundary
      - explicit future 2030_2035_2040 ATC/TTC capability
    rule: >-
      CEA future import-requirement MW and planned MVA/circuit-km are not future ATC.
      v1.0 keeps 4455 MW as the only source-valued ATC and does not infer a higher cap.

  import_price_series:
    status: source_bounded_annual_price_sensitivity_ready_interval_landed_cost_blocked
    evidence:
      - configs/grid_transfer_contract_evidence_2024_25.yaml
      - configs/full_pypsa_import_economics_v1_0.yaml
      - data/evidence/grid/kerala_import_economics_forward_transfer_v1_0_2026_09_25.json
    acquired:
      KSEBL_FY2023_24_weighted_purchase_cost_5_05_INR_per_kWh: true
      IEX_FY2023_24_DAM_5_24_INR_per_kWh: true
      delivered_bulk_supply_7_13_INR_per_kWh_stress_proxy: true
      RBI_NSO_CPI_common_real_2021_22_basis: true
      partial_import_vs_candidate_investment_objective_v1_0: true
    remaining:
      - landed Kerala-periphery contract/exchange cost by block and source
      - transmission charges losses DSM banking/swap obligations
      - interval market/contract price chronology and volume rights
      - forward 2030 fuel/market-price scenario
    rule: >-
      v1.0 admits annual source-bounded price proxies only as research sensitivities.
      They do not constitute a validated landed Kerala import-price series.

  reliability_criterion:
    status: research_benchmark_selected_probabilistic_evaluation_blocked
    evidence:
      - configs/research_input_selection_v0_2.yaml
    acquired:
      KSERC_review_metrics_LOLP_and_NENS: true
      CEA_state_RA_research_benchmark_LOLP_0_2pct_NENS_0_05pct: true
      benchmark_explicitly_not_Kerala_statutory_threshold: true
      deterministic_proxy_unserved_energy_metrics_defined: true
    remaining:
      - forced-outage distributions by technology/unit
      - stochastic demand and renewable sampling
      - contingency treatment and Monte-Carlo convergence
    rule: deterministic proxy unserved energy is not a LOLP estimate

  ev_charging:
    status: synthetic_only
    evidence:
      - configs/wp6_ev_charging_illustrative.yaml
    remaining:
      - current Kerala EV stock by vehicle type
      - arrival/departure and charging-power distributions
      - public/private charger geography
      - 2030_2035_2040 adoption and managed-charging participation

  demand_flexibility:
    status: synthetic_only
    evidence:
      - configs/wp6_cooling_tes_illustrative.yaml
      - configs/wp6_industrial_illustrative.yaml
    remaining:
      - statewide cooling stock/load response
      - industrial shiftable process evidence
      - water pumping and other controllable loads
      - participation limits rebound comfort and service constraints

  hydrogen_load:
    status: roadmap_only
    evidence:
      - data/evidence/assets/kerala_energy_asset_register_2026_09_25.json
    acquired:
      Kochi_valley_200_300MW_RE_aggregation_roadmap: true
      first_100MW_electrolyser_draft_incentive_target: true
      CIAL_BPCL_pilot: true
    remaining:
      - commissioned electrolyser MW and COD
      - utilisation profile efficiency compression/storage energy
      - hydrogen demand by refinery fertiliser transport maritime and export
    rule: green hydrogen is a future electricity demand/sector-coupling load, not generation

  processed_ecology_gis:
    status: blocked
    evidence:
      - configs/gis_forest_dem_wetlands_hazards_2026.yaml
      - configs/lulc_native_acquisition_2024_25.yaml
    remaining:
      - legally attributable forest/protected-area polygons
      - wetland/waterbody/paddy/ESZ and other statutory exclusions
      - valid hazard overlays and current native LULC
      - technology-specific combined mask and uncertainty treatment

  public_finance:
    status: blocked
    remaining:
      - define S5 public-capital accounting boundary
      - KSEBL/state equity debt grants VGF and central support treatment
      - annual versus cumulative cap
      - real/nominal price basis and discount/cost-of-capital assumptions
      - private and central project treatment

  technology_costs:
    status: research_2030_cost_finance_harmonised_not_validated
    evidence:
      - configs/techno_economics.yaml
      - configs/research_input_selection_v0_2.yaml
      - configs/full_pypsa_cost_finance_v0_5.yaml
    acquired:
      real_2021_22_INR_common_basis: true
      CERC_current_research_WACC_9_08pct: true
      solar_2030_capex_and_lifetime: true
      onshore_wind_2030_capex_and_lifetime: true
      BESS_4h_cost_bracket_and_RTE: true
      annualisation_validator_v0_5: true
    remaining:
      - post-2030 cost trajectories without unsupported extrapolation
      - generic BESS degradation/replacement and auxiliary-load formulation
      - site-specific PSP capex and hydraulic energy capacity
      - transmission and demand-response expansion costs
      - Kerala project-specific financing sensitivities where required
    rule: >-
      v0.5 admits national CEA/CERC values only as a bounded 2030 research-assumption
      package. It does not make them validated Kerala project costs.

release:
  research_proxy_adequacy_screen_possible_now: true
  research_hydro_flexibility_bracket_possible_now: true
  future_demand_counterfactual_screen_possible_now: true
  research_renewable_profile_screen_possible_now: true
  research_proxy_capacity_expansion_candidate_limits_possible_now: true
  research_proxy_capacity_expansion_counterfactual_completed: true
  direct_pypsa_proxy_expansion_equivalence_verified: true
  research_import_economic_sensitivity_possible_now: true
  research_daily_energy_hydro_dispatch_possible_now: true
  research_hydro_availability_sensitivity_possible_now: true
  research_assumption_capacity_expansion_possible_now: false
  reason: >-
    v0.2 admits deterministic proxy adequacy, v0.3 brackets intraday hydro flexibility,
    v0.4 adds source-anchor future-demand counterfactuals, v0.5 harmonises a bounded
    2030 research cost/finance package, v0.6 builds reproducible ERA5-derived
    five-point solar/wind screening profiles, v0.7 adds source-bounded statewide
    renewable-capacity envelopes, v0.8 completes an adequacy-first 2030 proxy
    expansion counterfactual, v0.9 reproduces all 36 full-year v0.8 cases through
    direct PyPSA/Linopy to solver precision, v1.0 adds source-bounded annual
    import-price sensitivities plus forward import-requirement benchmarks, and v1.1
    adds exact-daily-energy intraday hydro dispatch with reconciled major-station
    capacity groups plus source-anchored/synthetic availability sensitivities. Full
    economic capacity expansion remains blocked by validated landed/interval import
    economics, explicit future ATC, statutory/site-level siting, rooftop technical
    potential, capacity-weighted spatial allocation, observed outage chronology,
    reservoir/cascade hydro physics, PSP physics and unresolved existing-fleet
    operating costs.
  validated_run_possible_now: false

name: Full PyPSA scenario compiler

on:
  pull_request:
    paths:
      - "configs/scenario_dimensions.yaml"
      - "configs/scenarios_2040.yaml"
      - "configs/base_system_2026_03_31.yaml"
      - "public/scenarios.json"
      - "src/kerala2040/scenario_compiler.py"
      - "src/kerala2040/base_system.py"
      - "scripts/compile_full_pypsa_scenarios.py"
      - "scripts/reconcile_base_system.py"
      - "scripts/build_site.py"
      - "tests/test_scenario_compiler.py"
      - "tests/test_base_system.py"
      - "tests/test_scenario_specs_sync.py"
      - ".github/workflows/full-pypsa-scenarios.yml"
  push:
    branches: [main]
    paths:
      - "configs/scenario_dimensions.yaml"
      - "src/kerala2040/scenario_compiler.py"
      - "scripts/compile_full_pypsa_scenarios.py"
      - "tests/test_scenario_compiler.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-scenario-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint and test structural compiler
        run: |
          ruff check src/kerala2040/scenario_compiler.py src/kerala2040/base_system.py scripts/compile_full_pypsa_scenarios.py scripts/reconcile_base_system.py tests/test_scenario_compiler.py tests/test_base_system.py tests/test_scenario_specs_sync.py
          pytest -q tests/test_scenario_compiler.py tests/test_base_system.py tests/test_scenario_specs_sync.py
      - name: Reconcile canonical March-2026 base
        run: python scripts/reconcile_base_system.py
      - name: Compile S0-S5 x 2030/2035/2040
        run: python scripts/compile_full_pypsa_scenarios.py
      - uses: actions/upload-artifact@v4
        with:
          name: full-pypsa-scenario-matrix-NOT-optimised
          path: results/models/full_pypsa/scenario_matrix.json
          retention-days: 30

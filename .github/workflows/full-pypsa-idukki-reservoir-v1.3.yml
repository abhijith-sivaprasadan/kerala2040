name: Full PyPSA Idukki reservoir pilot v1.3

on:
  pull_request:
    paths:
      - "configs/full_pypsa_idukki_reservoir_v1_3.yaml"
      - "src/kerala2040/full_pypsa_idukki_reservoir_v1_3.py"
      - "scripts/run_full_pypsa_idukki_reservoir_v1_3.py"
      - "tests/test_full_pypsa_idukki_reservoir_v1_3.py"
      - "data/evidence/hydro/idukki_stateful_reservoir_boundaries_v1_3_2026_09_26.json"
      - "data/external/sldc_fy2024_25/reservoir_daily.csv"
      - "data/external/sldc_fy2024_25/hydro_station_daily.csv"
      - "configs/full_pypsa_hydro_interday_v1_2.yaml"
      - "configs/full_pypsa_import_economics_v1_0.yaml"
      - "configs/full_pypsa_future_adequacy_v0_4.yaml"
      - "configs/full_pypsa_proxy_expansion_v0_8.yaml"
      - "configs/full_pypsa_cost_finance_v0_5.yaml"
      - ".github/workflows/full-pypsa-idukki-reservoir-v1.3.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  idukki-reservoir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install modelling and ERA5 dependencies
        run: python -m pip install -e ".[dev,era5]"
      - name: Lint and unit-test v1.3
        run: |
          ruff check \
            src/kerala2040/full_pypsa_idukki_reservoir_v1_3.py \
            scripts/run_full_pypsa_idukki_reservoir_v1_3.py \
            tests/test_full_pypsa_idukki_reservoir_v1_3.py
          pytest -q tests/test_full_pypsa_idukki_reservoir_v1_3.py
      - name: Download verified Apr-Dec 2024 ERA5 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35622527064"
          pattern: era5-*-2024-*_to_2024-*-SOURCE-UNVALIDATED
          path: results/acquisition/era5/full-year-input/2024
          merge-multiple: false
      - name: Download verified Jan-Mar 2025 ERA5 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35623051780"
          pattern: era5-*-2025-01_to_2025-03-REACQUIRED-UNVALIDATED
          path: results/acquisition/era5/full-year-input/2025
          merge-multiple: false
      - name: Require exactly 20 independent location-quarter artifacts
        shell: bash
        run: |
          set -euo pipefail
          count="$(find results/acquisition/era5/full-year-input -type f -name retrieval_attempt.json | wc -l)"
          echo "retrieval manifests: $count"
          test "$count" -eq 20
      - name: Rebuild verified v0.6 renewable profiles
        run: |
          python scripts/build_full_pypsa_era5_profiles_v0_6.py \
            results/acquisition/era5/full-year-input
      - name: Run v1.3 stateful Idukki pilot and same-horizon brackets
        run: |
          python scripts/run_full_pypsa_idukki_reservoir_v1_3.py \
            --acknowledge-net-water-balance-not-catchment-inflow
      - name: Show compact v1.3 summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("results/models/full_pypsa/idukki_reservoir_v1_3/summary.json")
          data = json.loads(p.read_text())
          print("pilot_days:", data["pilot_days"])
          print("cases_solved:", data["cases_solved"])
          print("comparison_solves:", data["comparison_solves"])
          print("source_qa:", data["source_qa"])
          for row in data["cases"]:
              if (
                  row["demand_case"] == "reference_FY2030_31"
                  and row["idukki_availability_case"] == "full_available"
              ):
                  physical = row["physical_stateful"]
                  one = row["v1_2_same_horizon"]["window_1d"]
                  thirty = row["v1_2_same_horizon"]["window_30d"]
                  print(
                      row["transfer_case"],
                      "physical_GWh=", round(physical["stage2_unserved_mwh"]/1000, 3),
                      "1d_GWh=", round(one["stage2_unserved_mwh"]/1000, 3),
                      "30d_GWh=", round(thirty["stage2_unserved_mwh"]/1000, 3),
                      "Idukki_min_MCM=", round(physical["idukki_storage_min_mcm"], 2),
                      "spill_MCM=", round(physical["idukki_spill_equivalent_mcm"], 2),
                  )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-pypsa-idukki-reservoir-v1.3-NET-WATER-BALANCE-PILOT
          retention-days: 90
          if-no-files-found: error
          path: |
            results/models/full_pypsa/era5_renewables_v0_6/statewide_equal_weight_profile.parquet
            results/models/full_pypsa/idukki_reservoir_v1_3/summary.json

# This is a stateful Idukki reservoir pilot, but its reconstructed water term is
# a net balance residual, not observed catchment inflow. Passing does not validate
# spill/release chronology, head-dependent efficiency, cascades or policy operation.

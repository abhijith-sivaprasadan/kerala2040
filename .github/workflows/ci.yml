name: ci

on:
  schedule:
    - cron: "47 3 * * 3"
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - name: Preserve committed bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,geo]" "cairosvg>=2.7,<3"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: pytest
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Dashboard contract tests
        run: node --test tests/web.test.cjs
      - name: Package dashboard
        run: python scripts/build_site.py

name: Public reproducibility examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research package and test runner
        run: |
          python -m pip install -e .
          python -m pip install "pytest>=8,<9"
      - name: Test source-accounting and chronology guards
        run: python -m pytest -q tests/test_example_accounting.py tests/test_hydro_chronology_uncertainty.py tests/test_hydro_chronology_v0_2.py
      - name: Reproduce actual 354-day SLDC source-accounting check
        run: python examples/reproduce_daily_accounting.py --output results/examples/accounting_audit.json
      - name: Run source-rooted historical hydropower timing sensitivity
        run: python examples/hydro_chronology_sensitivity.py --output results/examples/hydro_chronology_sensitivity.json
      - name: Run restrained supply-timing and hydro ramp sensitivities
        run: python examples/hydro_supply_timing_v0_2.py --output results/examples/hydro_supply_timing_v0_2.json
      - name: Assert evidence levels, model invariants and informative experimental differences
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          a = json.loads(Path("results/examples/accounting_audit.json").read_text())
          s = json.loads(Path("results/examples/hydro_chronology_sensitivity.json").read_text())
          assert a["observed_days"] == 354 and a["missing_source_days"] == 11
          assert a["reconstructed_hours"] == 8760
          assert a["max_abs_observed_day_energy_residual_mu"] < 0.0001
          assert s["research_status"] == "CONTROLLED_SENSITIVITY_NOT_CALIBRATED_UNCERTAINTY"
          assert s["hourly_demand_evidence"] == "RECONSTRUCTED_NOT_MEASURED"
          assert len(s["results"]) == 10
          assert all(x["max_model_equation_residual_mw"] < 1e-4 for x in s["results"])
          assert all(x["avoided_unserved_mwh"] >= -1e-3 for x in s["results"])
          assert any(x["avoided_unserved_mwh"] > 1 for x in s["results"])
          # Permuting hours cannot matter when all other hourly constraints are time-invariant.
          for cap in s["import_limits_mw"]:
              cases = {x["shape"]: x for x in s["results"] if x["import_ceiling_mw"] == cap}
              for shifted in ("shift_earlier_2h", "shift_later_2h"):
                  for key in ("fixed_hydro_unserved_mwh", "flexible_hydro_unserved_mwh"):
                      assert abs(cases[shifted][key] - cases["baseline"][key]) < 1e-3
          v2 = json.loads(Path("results/examples/hydro_supply_timing_v0_2.json").read_text())
          assert v2["hourly_demand_evidence"] == "RECONSTRUCTED_NOT_MEASURED"
          assert v2["supply_availability"] == "ILLUSTRATIVE_HOURLY_DERATES_NOT_OBSERVED_IMPORT_CONSTRAINTS"
          assert v2["window_hours"] == 168
          assert len(v2["cases"]) == 40
          assert all(x["solver_checks"]["max_daily_hydro_energy_residual_mwh"] < 1e-3 for x in v2["cases"])
          assert all(x["solver_checks"]["max_hourly_balance_residual_mw"] < 1e-3 for x in v2["cases"])
          assert all(x["optimised_hydro_unserved_mwh"] <= x["fixed_hydro_unserved_mwh"] + 1e-3 for x in v2["cases"])
          for record in v2["cases"]:
              if record["hydro_ramp_cap_mw_per_h"] is not None:
                  assert record["solver_checks"]["actual_hydro_ramp_mw_per_h"] <= record["hydro_ramp_cap_mw_per_h"] + 1e-4
          def select(cap, supply, shape, ramp):
              return next(x for x in v2["cases"] if x["import_ceiling_mw"] == cap
                          and x["hypothetical_import_hourly_schedule"] == supply
                          and x["demand_shape"] == shape
                          and x["hydro_ramp_cap_mw_per_h"] == ramp)
          # Control must remain clock-shift invariant when supply is uniform and hydro is free.
          for cap in (4455.0, 3564.0):
              original = select(cap, "uniform_import_capacity", "baseline", None)
              for shape in ("shift_earlier_2h", "shift_later_2h"):
                  shifted = select(cap, "uniform_import_capacity", shape, None)
                  assert abs(original["fixed_hydro_unserved_mwh"] - shifted["fixed_hydro_unserved_mwh"]) < 1e-3
                  assert abs(original["optimised_hydro_unserved_mwh"] - shifted["optimised_hydro_unserved_mwh"]) < 1e-3
          # Falsification control: time-varying availability breaks fixed-hydro clock invariance.
          exposed = select(4455.0, "illustrative_18_22_import_20pct_derate", "baseline", None)
          misaligned = select(4455.0, "illustrative_18_22_import_20pct_derate", "shift_earlier_2h", None)
          assert abs(exposed["fixed_hydro_unserved_mwh"] - misaligned["fixed_hydro_unserved_mwh"]) > 1000
          # Constraining hydro must not beat free hydro; in one experiment it actually binds.
          free = select(3564.0, "illustrative_18_22_import_20pct_derate", "shift_earlier_2h", None)
          ramped = select(3564.0, "illustrative_18_22_import_20pct_derate", "shift_earlier_2h", 400.0)
          assert ramped["optimised_hydro_unserved_mwh"] > free["optimised_hydro_unserved_mwh"] + 10
          print("Verified constrained ramp and time-varying import illustrative sensitivity:")
          for record in v2["cases"]:
              if record["demand_shape"] in ("baseline", "shift_earlier_2h", "shift_later_2h"):
                  print("V2 "
                        f"cap={record['import_ceiling_mw']:.0f} "
                        f"schedule={record['hypothetical_import_hourly_schedule']} "
                        f"shape={record['demand_shape']} "
                        f"ramp={record['hydro_ramp_cap_mw_per_h']} "
                        f"fixed={record['fixed_hydro_unserved_mwh']:.4f} "
                        f"flex={record['optimised_hydro_unserved_mwh']:.4f}")
          print("Verified source-backed accounting; bounded historical sensitivity remains distinct from the 2030-31 result.")
          for case in s["results"]:
              print(
                  f"CASE transfer={case['import_ceiling_mw']:.0f}MW "
                  f"shape={case['shape']} "
                  f"fixed={case['fixed_hydro_unserved_mwh']:.4f}MWh "
                  f"flexible={case['flexible_hydro_unserved_mwh']:.4f}MWh "
                  f"avoided={case['avoided_unserved_mwh']:.4f}MWh"
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kerala2040-independent-research-examples
          path: results/examples/
          retention-days: 30

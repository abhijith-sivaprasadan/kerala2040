name: Full PyPSA Idukki reported inflow gate v1.4

on:
  pull_request:
    paths:
      - "configs/full_pypsa_idukki_inflow_release_v1_4.yaml"
      - "src/kerala2040/full_pypsa_idukki_inflow_release_v1_4.py"
      - "scripts/run_full_pypsa_idukki_inflow_release_v1_4.py"
      - "tests/test_full_pypsa_idukki_inflow_release_v1_4.py"
      - "data/evidence/models/full_pypsa_idukki_reservoir_v1_3_2026_09_26.json"
      - ".github/workflows/full-pypsa-idukki-inflow-release-v1.4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and focused tests
        run: |
          ruff check \
            src/kerala2040/full_pypsa_idukki_inflow_release_v1_4.py \
            scripts/run_full_pypsa_idukki_inflow_release_v1_4.py \
            tests/test_full_pypsa_idukki_inflow_release_v1_4.py
          pytest -q tests/test_full_pypsa_idukki_inflow_release_v1_4.py
      - name: Confirm public repository remains fail-closed
        run: |
          python scripts/run_full_pypsa_idukki_inflow_release_v1_4.py --gate-only
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "results/models/full_pypsa/idukki_inflow_release_v1_4/"
              "source_gate.json"
          )
          gate = json.loads(p.read_text())
          assert gate["status"] == "blocked_private_source_missing"
          assert gate["physical_run_ready"] is False
          assert gate["required_pilot_inflow_days"] == 364
          print(json.dumps(gate, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-pypsa-idukki-inflow-v1.4-PUBLIC-SOURCE-GATE
          retention-days: 90
          path: |
            results/models/full_pypsa/idukki_inflow_release_v1_4/source_gate.json

# A green public workflow means the v1.4 gate and synthetic solver are correct.
# It does NOT mean the private 364-day reported-inflow physical matrix has run.

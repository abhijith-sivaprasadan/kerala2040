name: Audit forest DEM wetlands and landslide GIS evidence

on:
  pull_request:
    paths:
      - "configs/gis_forest_dem_wetlands_hazards_2026.yaml"
      - "data/evidence/gis/gsi_2022_geometry_validation_2026_09_20.json"
      - "configs/gis_inputs.yaml"
      - "src/kerala2040/gis_three_workstreams.py"
      - "scripts/audit_gis_three_workstreams.py"
      - "scripts/probe_gis_public_sources.py"
      - "tests/test_gis_three_workstreams.py"
      - ".github/workflows/gis-three-evidence.yml"
  push:
    branches: [main]
    paths:
      - "configs/gis_forest_dem_wetlands_hazards_2026.yaml"
      - "data/evidence/gis/gsi_2022_geometry_validation_2026_09_20.json"
      - "src/kerala2040/gis_three_workstreams.py"
      - "scripts/audit_gis_three_workstreams.py"
      - ".github/workflows/gis-three-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scoped dependencies
        run: pip install "pyyaml>=6,<7" "pytest>=8,<9" "ruff>=0.7,<1" "rasterio>=1.4,<2" "numpy>=2,<3"
      - name: Test source provenance and fail-closed data admissions
        run: |
          ruff check src/kerala2040/gis_three_workstreams.py scripts/audit_gis_three_workstreams.py scripts/probe_gis_public_sources.py tests/test_gis_three_workstreams.py
          pytest -q tests/test_gis_three_workstreams.py
          python scripts/audit_gis_three_workstreams.py
      - name: Confirm no legal or ecological capacity claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("results/gis/three_workstreams_source_audit.json").read_text())
          assert len(a["workstreams"]) == 3
          assert a["workstreams"]["wetlands_waterbodies_landslide"]["published_gsi_2022_district_download_labels"] == 13
          assert a["ecological_eligibility_established"] is False
          assert a["capacity_ceiling_mw"] is None
          assert a["audit_gate_closed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: three-gis-source-workstreams-NOT-ELIGIBILITY
          path: results/gis/three_workstreams_source_audit.json
          retention-days: 90

  public-source-pilot:
    needs: source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public-source pilot dependencies
        run: pip install "pyyaml>=6,<7" "requests>=2.32,<3" "beautifulsoup4>=4.12,<5" "rasterio>=1.4,<2" "numpy>=2,<3"
      - name: Fetch original public Kerala DSM pilot and discover KSDMA archives
        run: python scripts/probe_gis_public_sources.py --max-mb 65
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-kerala-dem-and-gsi-archive-PILOTS-NOT-STATEWIDE
          path: |
            results/gis/public_source_probe.json
            results/gis/pilot_raw/**
          retention-days: 21

name: KSEB official Idukki source audit v1.5

on:
  pull_request:
    paths:
      - "src/kerala2040/kseb_dam_safety_official_v1_5.py"
      - "scripts/extract_kseb_idukki_official_v1_5.py"
      - "tests/test_kseb_dam_safety_official_v1_5.py"
      - "data/evidence/hydro/idukki_v1_5_official_source_boundary_2026_09_26.json"
      - "docs/IDUKKI_V1_5_OFFICIAL_KSEB_SOURCE_2026_09_26.md"
      - ".github/workflows/kseb-idukki-official-v1.5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint and unit tests
        run: |
          ruff check \
            src/kerala2040/kseb_dam_safety_official_v1_5.py \
            scripts/extract_kseb_idukki_official_v1_5.py \
            tests/test_kseb_dam_safety_official_v1_5.py
          pytest -q tests/test_kseb_dam_safety_official_v1_5.py
      - name: Probe and extract official KSEB pages
        run: |
          set +e
          python scripts/extract_kseb_idukki_official_v1_5.py \
            --url 'https://dams.kseb.in/?p=5176' \
            --url 'https://dams.kseb.in/?p=5178' \
            --url 'https://dams.kseb.in/?p=5180' \
            --out-json results/hydro/kseb_idukki_official_v1_5.json \
            --out-csv results/hydro/kseb_idukki_official_v1_5.csv
          echo "extract_exit_code=$?" >> "$GITHUB_ENV"
          exit 0
      - name: Validate data or record runner reachability gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("results/hydro/kseb_idukki_official_v1_5.json")
          result = json.loads(p.read_text())
          gate = {
              "classification": "KSEB_OFFICIAL_V1_5_CI_SOURCE_GATE",
              "record_count": result["record_count"],
              "error_count": result["error_count"],
          }

          if result["record_count"] == 3 and result["error_count"] == 0:
              rows = {row["date"]: row for row in result["records"]}
              expected = {
                  "2025-03-17": (755.568, 3.22, 25.94, 0.0),
                  "2025-03-18": (754.094, 17.94, 32.17, 0.0),
                  "2025-03-19": (750.899, 6.57, 40.74, 0.0),
              }
              for day, values in expected.items():
                  metrics = rows[day]["metrics"]
                  assert abs(metrics["live_storage_mcm"] - values[0]) < 1e-9
                  assert abs(metrics["inflow_cumecs"] - values[1]) < 1e-9
                  assert abs(
                      metrics["power_house_discharge_cumecs"] - values[2]
                  ) < 1e-9
                  assert abs(
                      metrics["spillway_release_cumecs"] - values[3]
                  ) < 1e-9
                  assert rows[day]["units"]["water_level_ft"] == "ft"
              fingerprints = {
                  row["schema"]["fingerprint_sha256"]
                  for row in result["records"]
              }
              assert len(fingerprints) == 1
              gate["status"] = "live_official_pages_verified"
          else:
              errors = [item["error"] for item in result["errors"]]
              timeout_only = (
                  result["record_count"] == 0
                  and result["error_count"] == 3
                  and all(
                      "timed out" in error.lower()
                      or "connecttimeouterror" in error.lower()
                      for error in errors
                  )
              )
              if not timeout_only:
                  raise SystemExit(
                      "KSEB source extraction failed for a reason other than "
                      "the known GitHub-runner connection timeout."
                  )
              gate["status"] = "blocked_github_hosted_runner_network_timeout"
              gate["interpretation"] = (
                  "Parser tests passed; GitHub-hosted runner could not connect "
                  "to dams.kseb.in. This is a source-reachability gate, not a "
                  "source-data or parser validation result."
              )

          out = Path(
              "results/hydro/kseb_idukki_official_v1_5_source_gate.json"
          )
          out.write_text(json.dumps(gate, indent=2, sort_keys=True) + "\n")
          print(json.dumps(gate, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kseb-idukki-official-v1.5-source-audit
          retention-days: 90
          path: |
            results/hydro/kseb_idukki_official_v1_5.json
            results/hydro/kseb_idukki_official_v1_5.csv
            results/hydro/kseb_idukki_official_v1_5_source_gate.json

# A green run means either:
# 1) three official KSEB pages were parsed and value-checked, or
# 2) parser tests passed but the GitHub-hosted runner hit the known KSEB
#    connection-timeout gate, which is recorded in the uploaded artifact.
# It never upgrades a network-blocked run into source validation.

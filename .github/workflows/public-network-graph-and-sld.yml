name: Build KSEBL public network graph and mine SLDs

on:
  push:
    branches: [main]
    paths:
      - "scripts/acquire_public_network_sources.py"
      - "scripts/build_kseb_public_network_graph.py"
      - "scripts/mine_kseb_public_slds.py"
      - "configs/public_network_acquisition_v0_1.json"
      - ".github/workflows/public-network-graph-and-sld.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-public-network:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install network/SVG-PDF mining dependencies
        run: |
          python -m pip install \
            "shapely>=2.0,<3" \
            "pypdf>=5,<7"

      - name: Acquire public grid layers and SLD PDFs
        run: |
          python scripts/acquire_public_network_sources.py \
            --download-sld \
            --sld-workers 4

      - name: Build 110 kV+ physical-site graph
        run: |
          python scripts/build_kseb_public_network_graph.py

      - name: Mine public SLD text
        run: |
          python scripts/mine_kseb_public_slds.py

      - name: Validate graph and SLD acquisition
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          graph_qa = json.loads(
              Path("results/network/public_grid_graph_v0_1/network_graph_qa.json").read_text()
          )
          sld_qa = json.loads(
              Path("results/network/public_sld_mining_v0_1/sld_mining_qa.json").read_text()
          )

          assert graph_qa["all_220plus_edges_resolved"] is True
          assert graph_qa["edge_counts_by_voltage"]["220"] >= 90
          assert graph_qa["edge_counts_by_voltage"]["400"] >= 20
          assert graph_qa["power_flow_ready"] is False

          assert sld_qa["inventory_records_valid"] >= 600
          assert sld_qa["pdfs_present"] >= 590
          assert sld_qa["automatic_ocr_used"] is False
          assert sld_qa["equipment_master_ready"] is False

          print("GRAPH QA")
          print(json.dumps(graph_qa, indent=2))
          print("SLD QA")
          print(json.dumps(sld_qa, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: kseb-public-network-graph-and-sld-mining-v0.1
          retention-days: 90
          if-no-files-found: error
          path: |
            results/network/public_grid_graph_v0_1/
            results/network/public_sld_mining_v0_1/
            results/acquisition/network_public_v0_1/public_sld_inventory.json
            results/acquisition/network_public_v0_1/acquisition_summary.json
            results/acquisition/network_public_v0_1/geojson/

      - uses: actions/upload-artifact@v4
        with:
          name: kseb-public-sld-pdf-archive-v0.1
          retention-days: 30
          if-no-files-found: warn
          path: results/acquisition/network_public_v0_1/sld/

# Public web sources only. No authentication to SOS/TrAMS and no OCR guessing.

name: KSEB monthly download probe

on:
  pull_request:
    paths:
      - ".github/workflows/kseb-monthly-download-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe DNS and transport
        shell: bash
        run: |
          set +e
          echo "=== DNS ==="
          getent ahostsv4 dams.kseb.in || true
          getent ahostsv6 dams.kseb.in || true
          echo "=== HTTPS HEAD ==="
          curl -4 -I -L -A 'Mozilla/5.0' --connect-timeout 10 --max-time 30             'https://dams.kseb.in/?wpdmdl=4421' || true
          echo "=== HTTP HEAD ==="
          curl -4 -I -L -A 'Mozilla/5.0' --connect-timeout 10 --max-time 30             'http://dams.kseb.in/?wpdmdl=4421' || true
      - name: Probe April and March packages
        shell: bash
        run: |
          set +e
          mkdir -p probe
          for id in 4421 5212; do
            echo "=== PACKAGE $id ==="
            curl -4 -L -A 'Mozilla/5.0'               --connect-timeout 10 --max-time 60               -D "probe/$id.headers"               -o "probe/$id.bin"               "https://dams.kseb.in/?wpdmdl=$id"
            code=$?
            echo "curl_exit=$code"
            sed -n '1,80p' "probe/$id.headers" || true
            ls -l "probe/$id.bin" 2>/dev/null || true
            file "probe/$id.bin" 2>/dev/null || true
            xxd -l 16 "probe/$id.bin" 2>/dev/null || true
          done
      - name: Inspect cached official KSEB workbook exemplars
        shell: bash
        run: |
          set -e
          python -m pip install --quiet openpyxl xlrd
          curl -L --fail --retry 3 \
            -o probe/kseb_legacy_window.xls \
            'https://raw.githubusercontent.com/Am4l-babu/aqua-sync/6c6ba263ef832f0d696a51e9d3ebc0355a6d5b68/research/raw/kseb_monthly/corrupt_window'
          file probe/kseb_legacy_window.xls
          python - <<'PY'
          import json
          from pathlib import Path
          import xlrd

          p = Path("probe/kseb_legacy_window.xls")
          info = {"size": p.stat().st_size}
          try:
              wb = xlrd.open_workbook(p)
              info["sheet_names"] = wb.sheet_names()
              info["sheet_count"] = wb.nsheets
              samples = {}
              for name in wb.sheet_names()[:3]:
                  ws = wb.sheet_by_name(name)
                  rows = []
                  for r in range(min(ws.nrows, 15)):
                      rows.append([ws.cell_value(r, col) for col in range(min(ws.ncols, 25))])
                  samples[name] = {"nrows": ws.nrows, "ncols": ws.ncols, "rows": rows}
              info["samples"] = samples
          except Exception as exc:
              info["xlrd_error"] = repr(exc)
          Path("probe/kseb_legacy_structure.json").write_text(
              json.dumps(info, indent=2, default=str), encoding="utf-8"
          )
          print(json.dumps(info, indent=2, default=str))
          PY
          
          curl -L --fail --retry 3 \
            -o probe/kseb_2026_07.xlsx \
            'https://raw.githubusercontent.com/Am4l-babu/aqua-sync/6c6ba263ef832f0d696a51e9d3ebc0355a6d5b68/research/raw/kseb_monthly/2026-07.xlsx'
          python - <<'PY'
          import json
          from pathlib import Path
          from openpyxl import load_workbook

          path = Path("probe/kseb_2026_07.xlsx")
          wb = load_workbook(path, read_only=True, data_only=True)
          summary = {"sheets": wb.sheetnames, "sheet_count": len(wb.sheetnames), "samples": {}}
          for name in wb.sheetnames[:5]:
              ws = wb[name]
              rows = []
              for row in ws.iter_rows(min_row=1, max_row=min(ws.max_row, 15), values_only=True):
                  rows.append([None if v is None else str(v) for v in row[:25]])
              summary["samples"][name] = {
                  "max_row": ws.max_row,
                  "max_column": ws.max_column,
                  "rows": rows,
              }
          Path("probe/kseb_2026_07_structure.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kseb-monthly-download-probe
          retention-days: 7
          path: probe/
          if-no-files-found: ignore

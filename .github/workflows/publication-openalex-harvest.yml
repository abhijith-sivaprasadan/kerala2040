name: Publication OpenAlex OA full-text lookup

on:
  push:
    branches:
      - publication/oa-fulltext-discovery-2026
    paths:
      - ".github/workflows/publication-openalex-harvest.yml"
  workflow_dispatch:
    inputs:
      source:
        description: "Open-access lookup provider"
        type: choice
        options:
          - openalex
          - both
        default: openalex
        required: true
      limit:
        description: "Number of DOI entries (0 = all DOI entries)"
        type: number
        default: 0
        required: true
      download_pdfs:
        description: "Temporarily fetch and verify OA PDFs on runner; do not redistribute as artifacts"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: publication-openalex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  doi-oa-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate reference evidence matrix
        run: python publication/literature/validate.py
      - name: Test OA discovery without network
        run: python -m unittest discover -v -s publication/literature -p "test_find_open_fulltexts.py"
      - name: OpenAlex metadata lookup (API key scoped to this step only)
        shell: bash
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
          REQUESTED_SOURCE: ${{ inputs.source }}
          REQUESTED_LIMIT: ${{ inputs.limit }}
          REQUESTED_PDFS: ${{ inputs.download_pdfs }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(--provider openalex --out publication/literature/oa_discovery_results.csv --interval 1)
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED_SOURCE" == "both" ]]; then
              if [[ -z "${UNPAYWALL_EMAIL:-}" ]]; then
                echo "::error::To choose both providers, set a GitHub Actions secret UNPAYWALL_EMAIL. Otherwise choose openalex."
                exit 1
              fi
              args=(--provider both --out publication/literature/oa_discovery_results.csv --interval 1)
            fi
            if [[ "$REQUESTED_LIMIT" =~ ^[0-9]+$ ]] && (( REQUESTED_LIMIT > 0 )); then
              args+=(--limit "$REQUESTED_LIMIT")
            fi
          fi
          if [[ -z "${OPENALEX_API_KEY:-}" ]]; then
            echo "::notice::No OPENALEX_API_KEY secret configured. Attempting OpenAlex public anonymous access."
          else
            echo "Using OPENALEX_API_KEY GitHub Actions secret."
          fi
          python publication/literature/find_open_fulltexts.py "${args[@]}"
      - name: Install structural PDF verification dependency
        if: github.event_name == 'push' || inputs.download_pdfs == true
        run: python -m pip install 'pypdf==5.9.0'
      - name: Download publicly listed PDF candidates (private ephemeral runner)
        if: github.event_name == 'push' || inputs.download_pdfs == true
        shell: bash
        run: |
          set -euo pipefail
          # The API key is intentionally NOT available to this step.
          python publication/literature/fetch_candidate_pdfs.py
      - name: Verify PDF structure and first-page identity evidence
        if: github.event_name == 'push' || inputs.download_pdfs == true
        run: python publication/literature/verify_open_pdfs.py
      - name: Summarize DOI open-access locations
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import os
          from collections import Counter
          from pathlib import Path
          p = Path("publication/literature/oa_discovery_results.csv")
          if not p.exists():
              print("No DOI lookup manifest was produced.")
              raise SystemExit(0)
          with p.open(encoding="utf-8", newline="") as file:
              records = list(csv.DictReader(file))
          status = Counter(r["query_status"] for r in records)
          pdf = Counter(r["pdf_status"] for r in records)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as f:
              f.write("## Kerala2040: OpenAlex literature lookup\n\n")
              credential_mode = "repository Actions secret configured" if os.environ.get("OPENALEX_API_KEY") else "anonymous OpenAlex access (no secret available)"
              f.write(f"- OpenAlex authentication mode: **{credential_mode}**\n")
              f.write(f"- DOI records attempted: **{len(records)}**\n")
              f.write(f"- Candidate OA PDF links: **{status.get('oa_pdf_candidate',0)}**\n")
              f.write(f"- No direct PDF but metadata found: **{status.get('no_direct_oa_pdf',0)}**\n")
              f.write(f"- Lookup failed: **{status.get('lookup_failed',0)}**\n")
              f.write(f"- PDFs temporarily verified (not distributed): **{pdf.get('saved_pdf_signature_verified',0)}**\n\n")
              f.write("Only OA/PDF-verification metadata CSVs are uploaded. No third-party article PDF bytes.\n")
          print(dict(status))
          print(dict(pdf))
          PY
      - name: Upload DOI-to-OA provenance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kerala2040-openalex-oa-links-${{ github.run_number }}
          path: |
            publication/literature/oa_discovery_results.csv
            publication/literature/pdf_validation_results.csv
          if-no-files-found: warn
          retention-days: 30

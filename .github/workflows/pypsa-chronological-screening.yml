name: PyPSA chronology and observed evidence figures

on:
  pull_request:
    paths:
      - "src/kerala2040/chronological_screen.py"
      - "src/kerala2040/weather_load_proxy.py"
      - "scripts/run_hourly_screening.py"
      - "scripts/build_weather_sensitive_load_proxy.py"
      - "scripts/compare_hourly_screening_profiles.py"
      - "src/kerala2040/weather_sensitive_load.py"
      - "tests/test_weather_sensitive_load.py"
      - "data/evidence/weather/era5_kerala_state_daily_all24_fy2024_25.csv"
      - "scripts/build_weather_sensitive_load_proxy.py"
      - "scripts/compare_hourly_screening_profiles.py"
      - "src/kerala2040/weather_sensitive_load.py"
      - "tests/test_weather_sensitive_load.py"
      - "data/evidence/weather/era5_kerala_state_daily_all24_fy2024_25.csv"
      - "scripts/build_sldc_observed_figures.py"
      - "tests/test_chronological_screen.py"
      - "tests/test_weather_load_proxy.py"
      - "tests/test_observed_figures.py"
      - "configs/pypsa_screening_example.yaml"
      - "data/evidence/demand/hourly_load_proxy_era5_weather_sensitive_v2/**"
      - ".github/workflows/pypsa-chronological-screening.yml"
  push:
    branches: [main]
    paths:
      - "src/kerala2040/chronological_screen.py"
      - "src/kerala2040/weather_load_proxy.py"
      - "scripts/run_hourly_screening.py"
      - "scripts/build_sldc_observed_figures.py"
      - "tests/test_chronological_screen.py"
      - "tests/test_weather_load_proxy.py"
      - "tests/test_observed_figures.py"
      - "configs/pypsa_screening_example.yaml"
      - "data/evidence/demand/hourly_load_proxy_era5_weather_sensitive_v2/**"
  workflow_dispatch:
    inputs:
      hours:
        description: "24..8760 complete-hour-day window (8760 is full-year proxy)"
        default: "48"
        required: true
        type: string

permissions:
  contents: read

jobs:
  solve-screening:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Test provenance checks, HiGHS smoke solve and figures
        run: |
          ruff check src/kerala2040/chronological_screen.py src/kerala2040/weather_load_proxy.py scripts/run_hourly_screening.py scripts/build_sldc_observed_figures.py tests/test_chronological_screen.py tests/test_weather_load_proxy.py tests/test_observed_figures.py
          pytest -q tests/test_chronological_screen.py tests/test_weather_load_proxy.py tests/test_observed_figures.py
      - name: Build measured-daily evidence figures
        run: python scripts/build_sldc_observed_figures.py
      - name: Build ERA5-sensitive hourly load proxy
        run: python scripts/build_weather_sensitive_load_proxy.py
      - name: Solve old and ERA5-sensitive full-year PyPSA baselines
        run: |
          python scripts/run_hourly_screening.py --acknowledge-proxy --hours 8760 --output results/models/hourly_proxy_screening_old
          python scripts/run_hourly_screening.py --acknowledge-proxy --hours 8760 \
            --proxy results/models/weather_sensitive_hourly_load/weather_sensitive_hourly_load.json \
            --output results/models/hourly_proxy_screening_era5
          python scripts/compare_hourly_screening_profiles.py \
            --old results/models/hourly_proxy_screening_old \
            --era5 results/models/hourly_proxy_screening_era5 \
            --shape-summary results/models/weather_sensitive_hourly_load/summary.json \
            --out results/models/hourly_proxy_comparison/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: pypsa-screening-era5-weather-sensitive-comparison
          path: |
            results/models/weather_sensitive_hourly_load/
            results/models/hourly_proxy_screening_old/
            results/models/hourly_proxy_screening_era5/
            results/models/hourly_proxy_comparison/
            results/figures/sldc_observed_fy2024_25/
          retention-days: 30

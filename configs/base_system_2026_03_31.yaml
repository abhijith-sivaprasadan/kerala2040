    - id: ksebl_brahmapuram_bdpp
      accounting_mw: 63.96
      ownership: state
      dispatch_ready: false
      blocker: unit availability, heat rate and fuel cost unresolved
    - id: ksebl_kozhikode_kdpp
      accounting_mw: 96.00
      ownership: state
      dispatch_ready: false
      blocker: unit availability, heat rate and fuel cost unresolved
    - id: residual_private_thermal
      accounting_mw: 17.00
      ownership: private
      dispatch_ready: false

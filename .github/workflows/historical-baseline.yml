name: historical-baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/kerala2040/load_proxy.py"
      - "scripts/build_hourly_load_proxy.py"
      - "src/kerala2040/hydro.py"
      - "src/kerala2040/renewables.py"
      - "src/kerala2040/historical_model.py"
      - "src/kerala2040/reconciliation.py"
      - "src/kerala2040/generators.py"
      - "scripts/analyse_hydro.py"
      - "scripts/build_renewable_profiles.py"
      - "scripts/build_historical_model.py"
      - "scripts/reconcile_energy.py"
      - "scripts/build_generator_database.py"
      - ".github/workflows/historical-baseline.yml"

permissions:
  contents: write

concurrency:
  group: public-evidence-publisher
  cancel-in-progress: false

jobs:
  fy2024-25:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ingest SLDC daily electricity balance
        run: >-
          python scripts/ingest_sldc_daily.py
          --start 2024-04-01 --end 2025-03-31
          --delay-seconds 0.8 --allow-gaps
      - name: Ingest SLDC reservoir storage
        run: >-
          python scripts/ingest_sldc_storage.py
          --start 2024-04-01 --end 2025-03-31
          --delay-seconds 0.8 --allow-gaps
      - name: Ingest representative-point weather
        continue-on-error: true
        run: >-
          python scripts/ingest_weather_grid.py
          --start 2024-04-01 --end 2025-03-31
      - name: Analyse and enforce calibration gate
        id: analyse
        continue-on-error: true
        run: >-
          python scripts/analyse_sldc_daily.py
          --start 2024-04-01 --end 2025-03-31
          --minimum-coverage 0.95 --balance-tolerance-mu 0.05
          --fail-on-gate
      - name: Analyse observed hydro/storage/import relationships
        if: always()
        run: python scripts/analyse_hydro.py
      - name: Build weather-derived renewable availability proxies
        if: always()
        run: |
          if [ -f data/processed/weather_points.parquet ]; then
            python scripts/build_renewable_profiles.py
          else
            echo "NASA POWER weather acquisition unavailable; renewable proxy profiles not built."
          fi
      - name: Build canonical generator/capacity inventory
        if: always()
        run: python scripts/build_generator_database.py
      - name: Build observed-day PyPSA replay
        if: always()
        run: python scripts/build_historical_model.py
      - name: Reconcile official FY2024-25 energy accounting
        if: always()
        run: python scripts/reconcile_energy.py
      - name: Build provenance-safe hourly load proxy
        if: always()
        run: python scripts/build_hourly_load_proxy.py
      - name: Refresh published evidence before merging this acquisition
        if: always()
        run: git pull --ff-only origin main
      - name: Build public web-data bundle
        if: always()
        run: python scripts/build_web_bundle.py
      - name: Validate combined evidence
        run: python scripts/build_site.py --check
      - name: Commit public web-data bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "Public web bundle is unchanged."
          else
            git commit -m "Update public web data [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kerala-fy2024-25-historical-baseline
          path: |
            data/processed/*.parquet
            data/processed/*.json
            results/baseline/**
            results/hydro/**
            results/resources/**
            results/inventory/**
            results/reconciliation/**
            results/models/**
            figures/baseline/**
            figures/hydro/**
            public/**
      - name: Calibration gate result
        if: always()
        run: |
          if [ "${{ steps.analyse.outcome }}" != "success" ]; then
            echo "Historical calibration gate did not pass; inspect uploaded evidence."
            exit 1
          fi

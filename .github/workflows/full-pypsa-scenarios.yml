name: Full PyPSA scenario compiler

on:
  pull_request:
    paths:
      - "configs/scenario_dimensions.yaml"
      - "configs/scenarios_2040.yaml"
      - "configs/base_system_2026_03_31.yaml"
      - "configs/research_input_selection_v0_1.yaml"
      - "data/evidence/assets/kerala_existing_fleet_2026_03_31.json"
      - "data/evidence/assets/kerala_re_crosswalk_2026_03_31.json"
      - "public/scenarios.json"
      - "src/kerala2040/scenario_compiler.py"
      - "src/kerala2040/base_system.py"
      - "src/kerala2040/full_pypsa_skeleton.py"
      - "scripts/compile_full_pypsa_scenarios.py"
      - "scripts/reconcile_base_system.py"
      - "scripts/build_full_pypsa_skeleton.py"
      - "scripts/build_site.py"
      - "tests/test_scenario_compiler.py"
      - "tests/test_base_system.py"
      - "tests/test_existing_fleet_2026.py"
      - "tests/test_research_input_selection.py"
      - "tests/test_full_pypsa_skeleton.py"
      - "tests/test_scenario_specs_sync.py"
      - ".github/workflows/full-pypsa-scenarios.yml"
  push:
    branches: [main]
    paths:
      - "configs/scenario_dimensions.yaml"
      - "configs/scenarios_2040.yaml"
      - "configs/base_system_2026_03_31.yaml"
      - "configs/research_input_selection_v0_1.yaml"
      - "data/evidence/assets/kerala_existing_fleet_2026_03_31.json"
      - "data/evidence/assets/kerala_re_crosswalk_2026_03_31.json"
      - "public/scenarios.json"
      - "src/kerala2040/scenario_compiler.py"
      - "src/kerala2040/base_system.py"
      - "src/kerala2040/full_pypsa_skeleton.py"
      - "scripts/compile_full_pypsa_scenarios.py"
      - "scripts/reconcile_base_system.py"
      - "scripts/build_full_pypsa_skeleton.py"
      - "scripts/build_site.py"
      - "tests/test_scenario_compiler.py"
      - "tests/test_base_system.py"
      - "tests/test_existing_fleet_2026.py"
      - "tests/test_research_input_selection.py"
      - "tests/test_full_pypsa_skeleton.py"
      - "tests/test_scenario_specs_sync.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-scenario-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint and test structural compiler
        run: |
          ruff check src/kerala2040/scenario_compiler.py src/kerala2040/base_system.py src/kerala2040/full_pypsa_skeleton.py scripts/compile_full_pypsa_scenarios.py scripts/reconcile_base_system.py scripts/build_full_pypsa_skeleton.py tests/test_scenario_compiler.py tests/test_base_system.py tests/test_existing_fleet_2026.py tests/test_research_input_selection.py tests/test_full_pypsa_skeleton.py tests/test_scenario_specs_sync.py
          pytest -q tests/test_scenario_compiler.py tests/test_base_system.py tests/test_existing_fleet_2026.py tests/test_research_input_selection.py tests/test_full_pypsa_skeleton.py tests/test_scenario_specs_sync.py
      - name: Reconcile canonical March-2026 base
        run: python scripts/reconcile_base_system.py
      - name: Build disabled full-PyPSA structural skeleton
        run: python scripts/build_full_pypsa_skeleton.py
      - name: Compile S0-S5 x 2030/2035/2040
        run: python scripts/compile_full_pypsa_scenarios.py
      - uses: actions/upload-artifact@v4
        with:
          name: full-pypsa-structural-inputs-NOT-optimised
          path: |
            results/models/full_pypsa/scenario_matrix.json
            results/models/full_pypsa/base_system_2026_03_31.json
            results/models/full_pypsa/network_skeleton_2026_03_31.json
          retention-days: 30

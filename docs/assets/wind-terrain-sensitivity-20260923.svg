<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="860" viewBox="0 0 1330 860" role="img" aria-labelledby="title desc"><title id="title">Terrain sensitivity among NIWE Kerala resource point centres at modelled wind 7 metres per second and higher</title><desc id="desc">Within each source-defined district or Kerala, the plotted point count under a DSM slope maximum is divided by count under slope maximum 20 degrees for the same modelled wind threshold. At 5 degrees, Palakkad 70.49 percent, Idukki 19.55 percent, Kerala 49.28 percent. These are hypothetical source-point subsets, not engineering or legal screening results.</desc><rect width="1330" height="860" fill="#fffdfa"/><rect width="1330" height="14" fill="#1f493a"/><text x="55" y="70" font-family="Arial,sans-serif" font-size="22" letter-spacing="3" font-weight="700" fill="#1f493a">KERALA2040 / SENSITIVITY TEST</text><text x="55" y="123" font-family="Georgia,serif" font-size="38" fill="#1c3328">Terrain limits change the resource-point subset</text><text x="55" y="162" font-family="Arial,sans-serif" font-size="19" fill="#4a5f53">Hold modelled 150 m wind speed ≥7 m/s; vary maximum GLO-90 DSM surface slope</text><line x1="168" y1="638" x2="1096" y2="638" stroke="#dce4dc" stroke-width="1"/><text x="148" y="644" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#526259">0%</text><line x1="168" y1="557" x2="1096" y2="557" stroke="#dce4dc" stroke-width="1"/><text x="148" y="563" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#526259">20%</text><line x1="168" y1="476" x2="1096" y2="476" stroke="#dce4dc" stroke-width="1"/><text x="148" y="482" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#526259">40%</text><line x1="168" y1="395" x2="1096" y2="395" stroke="#dce4dc" stroke-width="1"/><text x="148" y="401" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#526259">60%</text><line x1="168" y1="314" x2="1096" y2="314" stroke="#dce4dc" stroke-width="1"/><text x="148" y="320" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#526259">80%</text><line x1="168" y1="233" x2="1096" y2="233" stroke="#dce4dc" stroke-width="1"/><text x="148" y="239" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#526259">100%</text><text x="210" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#324a3d">≤5°</text><text x="490" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#324a3d">≤10°</text><text x="770" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#324a3d">≤15°</text><text x="1050" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#324a3d">≤20°</text><path d="M210 352.5201857345544 L490 307.3344511801883 L770 268.5739713659229 L1050 233" fill="none" stroke="#1f6049" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="210" cy="352.5201857345544" r="8" fill="#fffdfa" stroke="#1f6049" stroke-width="4"/><circle cx="490" cy="307.3344511801883" r="8" fill="#fffdfa" stroke="#1f6049" stroke-width="4"/><circle cx="770" cy="268.5739713659229" r="8" fill="#fffdfa" stroke="#1f6049" stroke-width="4"/><circle cx="1050" cy="233" r="8" fill="#fffdfa" stroke="#1f6049" stroke-width="4"/><text x="214" y="331.5201857345544" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#1f6049">70.49%</text><path d="M210 558.8387382075472 L490 422.60495283018867 L770 315.8626179245283 L1050 233" fill="none" stroke="#ba6c35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 5"/><circle cx="210" cy="558.8387382075472" r="8" fill="#fffdfa" stroke="#ba6c35" stroke-width="4"/><circle cx="490" cy="422.60495283018867" r="8" fill="#fffdfa" stroke="#ba6c35" stroke-width="4"/><circle cx="770" cy="315.8626179245283" r="8" fill="#fffdfa" stroke="#ba6c35" stroke-width="4"/><circle cx="1050" cy="233" r="8" fill="#fffdfa" stroke="#ba6c35" stroke-width="4"/><text x="214" y="539.8387382075472" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ba6c35">19.55%</text><path d="M210 438.4315499606609 L490 362.7848151062156 L770 295.2317073170732 L1050 233" fill="none" stroke="#465974" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><circle cx="210" cy="438.4315499606609" r="8" fill="#fffdfa" stroke="#465974" stroke-width="4"/><circle cx="490" cy="362.7848151062156" r="8" fill="#fffdfa" stroke="#465974" stroke-width="4"/><circle cx="770" cy="295.2317073170732" r="8" fill="#fffdfa" stroke="#465974" stroke-width="4"/><circle cx="1050" cy="233" r="8" fill="#fffdfa" stroke="#465974" stroke-width="4"/><text x="214" y="455.4315499606609" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#465974">49.28%</text><line x1="78" y1="730" x2="126" y2="730" stroke="#1f6049" stroke-width="5" /><text x="137" y="738" font-family="Arial,sans-serif" font-size="19" fill="#1c3328">Palakkad: n(≤20°) = 7,753</text><line x1="483" y1="730" x2="531" y2="730" stroke="#ba6c35" stroke-width="5" stroke-dasharray="12 5"/><text x="542" y="738" font-family="Arial,sans-serif" font-size="19" fill="#1c3328">Idukki: n(≤20°) = 3,392</text><line x1="887" y1="730" x2="935" y2="730" stroke="#465974" stroke-width="5" stroke-dasharray="3 5"/><text x="946" y="738" font-family="Arial,sans-serif" font-size="19" fill="#1c3328">Kerala (all): n(≤20°) = 12,710</text><text x="55" y="792" font-family="Arial,sans-serif" font-size="17" fill="#2e473a">Y AXIS = count at slope limit / count at ≤20° for same ≥7 m/s source-point subset. All series equal 100% at ≤20° by definition.</text><text x="55" y="822" font-family="Arial,sans-serif" font-size="16" fill="#637065">NIWE 150 m × Copernicus GLO-90 DSM × original NWIC district boundaries; QA 2026-09-23. Not eligible land, turbine sites or MW.</text></svg>
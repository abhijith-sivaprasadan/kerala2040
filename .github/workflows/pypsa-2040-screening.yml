name: 2040 published-demand PyPSA proxy screening

on:
  pull_request:
    paths:
      - "src/kerala2040/planning_2040.py"
      - "scripts/run_2040_proxy_screening.py"
      - "tests/test_planning_2040.py"
      - "docs/PYPSA_2040_PROXY_SCREENING.md"
      - ".github/workflows/pypsa-2040-screening.yml"
  push:
    branches: [main]
    paths:
      - "src/kerala2040/planning_2040.py"
      - "scripts/run_2040_proxy_screening.py"
      - "tests/test_planning_2040.py"
  workflow_dispatch:
    inputs:
      hours:
        description: "24..8760 hours (whole days; 48 default)"
        default: "48"
        required: true
        type: string

permissions:
  contents: read

jobs:
  solve-reference-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint and validate the published-demand references
        run: |
          ruff check src/kerala2040/planning_2040.py scripts/run_2040_proxy_screening.py tests/test_planning_2040.py
          pytest -q tests/test_planning_2040.py
      - name: Solve 2040 demand on FY2024-25 proxy shape
        env:
          REQUEST_HOURS: ${{ inputs.hours || '48' }}
        run: |
          python scripts/run_2040_proxy_screening.py --acknowledge-proxy --hours "$REQUEST_HOURS"
      - uses: actions/upload-artifact@v4
        with:
          name: 2040-demand-proxy-sensitivity-NOT-validated-optimisation
          path: results/models/2040_proxy_screening/
          retention-days: 30

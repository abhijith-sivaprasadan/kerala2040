<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1170" viewBox="0 0 1400 1170" role="img" aria-labelledby="title desc"><title id="title">Matched-pixel February-to-July modelled PVOUT decline by original NWIC district</title><desc id="desc">A median is computed from individual native PVOUT pixel February to July percentage decreases rather than separate monthly medians. The paired median is 32.23 percent for Thiruvananthapuram and 49.22 percent for Wayanad. Publisher-modelled 1999–2018 reference PV output, not measured installed Kerala PV production.</desc><rect width="1400" height="1170" fill="#fffdfa"/><rect width="1400" height="12" fill="#1e4c3c"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="19" letter-spacing="3" font-weight="700" fill="#1e4c3c">KERALA2040 / SOLAR SEASONALITY</text><text x="60" y="125" font-family="Georgia,serif" font-size="37" fill="#1a2b22">The seasonal PVOUT decline is not uniform</text><text x="60" y="163" font-family="Arial,sans-serif" font-size="17" fill="#556b5c">At each source pixel: 100 × (February − July) / February; median within its NWIC district</text><line x1="422" y1="198" x2="422" y2="1022" stroke="#dae4db"/><text x="422" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#445a4b">0%</text><line x1="587" y1="198" x2="587" y2="1022" stroke="#dae4db"/><text x="587" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#445a4b">15%</text><line x1="752" y1="198" x2="752" y2="1022" stroke="#dae4db"/><text x="752" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#445a4b">30%</text><line x1="917" y1="198" x2="917" y2="1022" stroke="#dae4db"/><text x="917" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#445a4b">45%</text><line x1="1082" y1="198" x2="1082" y2="1022" stroke="#dae4db"/><text x="1082" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#445a4b">60%
name: Publish expanded SLDC evidence v1.0.1

on:
  push:
    branches: [main]
    paths:
      - "docs/releases/v1.0.1.md"

permissions:
  contents: write

concurrency:
  group: research-v1.0.1-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate exact release source
        run: |
          ruff check src tests scripts
          pytest
          node --check docs/assets/app.js
          node --test tests/web.test.cjs
          python scripts/build_site.py --check
          python scripts/build_site.py --output _site
      - name: Ensure processed evidence and source identity are present
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          qa = json.loads(Path("data/external/sldc_fy2024_25/qa_report.json").read_text())
          evidence = json.loads(Path("_site/data/sldc-station-evidence.json").read_text())
          assert evidence["classification"] == "derived_from_measured"
          assert evidence["observed_days"] == 354 and len(evidence["missing_dates"]) == 11
          assert evidence["source_archive_sha256"] == qa["source_archive_sha256"]
          with zipfile.ZipFile("_site/data/sldc-processed-evidence.zip") as z:
              assert "sldc_processed/qa_report.json" in z.namelist()
          PY
      - name: Create v1.0.1 tag and release (do not overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo "v1.0.1 already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create v1.0.1 \
            --target "$RELEASE_SHA" \
            --title "Kerala 2040 v1.0.1 — expanded SLDC daily evidence" \
            --notes-file docs/releases/v1.0.1.md \
            public/sldc-processed-evidence.zip \
            data/external/sldc_fy2024_25/qa_report.json

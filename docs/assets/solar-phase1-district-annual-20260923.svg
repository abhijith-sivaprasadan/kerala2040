<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1170" viewBox="0 0 1400 1170" role="img" aria-labelledby="title desc"><title id="title">Annual modelled solar PVOUT by 14 original NWIC Kerala districts</title><desc id="desc">Alphabetical district source-pixel medians of GSA 2.0 1999–2018 annual PVOUT kWh per kWp per year. Alappuzha 1553.41, Idukki 1442.55 and Wayanad 1504.46. These values are not land eligibility or installed capacity.</desc><rect width="1400" height="1170" fill="#fffdfa"/><rect width="1400" height="12" fill="#1e4c3c"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="19" letter-spacing="3" font-weight="700" fill="#1e4c3c">KERALA2040 / SOLAR RESOURCE</text><text x="60" y="125" font-family="Georgia,serif" font-size="37" fill="#1a2b22">Annual modelled PV resource across districts</text><text x="60" y="163" font-family="Arial,sans-serif" font-size="17" fill="#556b5c">Global Solar Atlas 2.0 · original NWIC district polygons · 30-arcsecond PVOUT pixel medians</text><line x1="422" y1="198" x2="422" y2="1022" stroke="#dae4db"/><text x="422" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#445a4b">0</text><line x1="572.5882352941177" y1="198" x2="572.5882352941177" y2="1022" stroke="#dae4db"/><text x="572.5882352941177" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#445a4b">400</text><line x1="723.1764705882354" y1="198" x2="723.1764705882354" y2="1022" stroke="#dae4db"/><text x="723.1764705882354" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#445a4b">800</text><line x1="873.7647058823529" y1="198" x2="873.7647058823529" y2="1022" stroke="#dae4db"/><text x="873.7647058823529" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#445a4b">1,200</text><line x1="1024.3529411764707" y1="198" x2="1024.3529411764707" y2="1022" stroke="#dae4db"/><text x="1024.3529411764707" y="190" text-anchor="middle" font-fami
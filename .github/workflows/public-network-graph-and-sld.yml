name: Build KSEBL public network graph and mine SLDs

on:
  push:
    branches: [main]
    paths:
      - "scripts/acquire_public_network_sources.py"
      - "scripts/build_kseb_public_network_graph.py"
      - "scripts/build_kseb_public_network_graph_v0_2.py"
      - "scripts/mine_kseb_public_slds.py"
      - "scripts/promote_kseb_sld_transformers.py"
      - "scripts/map_generator_census_to_public_grid.py"
      - "scripts/build_kseb_public_multibus_skeleton.py"
      - "scripts/build_kseb_public_pss_evidence.py"
      - "data/evidence/network/kseb_pss_2022_23_110plus_snapshot.json"
      - "scripts/build_kseb_transport_screening_inputs.py"
      - "scripts/run_kseb_network_chronological_screening_v1_0.py"
      - "scripts/run_kseb_network_bottleneck_robustness_v1_0.py"
      - "src/kerala2040/kseb_network_chronological_screen.py"
      - "configs/kseb_network_chronological_screening_v1_0.yaml"
      - "tests/test_kseb_network_chronological_screen.py"
      - "data/evidence/demand/hourly_load_proxy_era5_weather_sensitive_v2/**"
      - "scripts/build_generator_census_fy2024_25.py"
      - "src/kerala2040/generator_census.py"
      - "data/evidence/generation/fy2024_25_generator_capacity_census.json"
      - "configs/public_network_acquisition_v0_1.json"
      - ".github/workflows/public-network-graph-and-sld.yml"
  pull_request:
    paths:
      - "scripts/acquire_public_network_sources.py"
      - "scripts/build_kseb_public_network_graph.py"
      - "scripts/build_kseb_public_network_graph_v0_2.py"
      - "scripts/mine_kseb_public_slds.py"
      - "scripts/promote_kseb_sld_transformers.py"
      - "scripts/map_generator_census_to_public_grid.py"
      - "scripts/build_kseb_public_multibus_skeleton.py"
      - "scripts/build_kseb_public_pss_evidence.py"
      - "data/evidence/network/kseb_pss_2022_23_110plus_snapshot.json"
      - "scripts/build_kseb_transport_screening_inputs.py"
      - "data/evidence/demand/hourly_load_proxy_era5_weather_sensitive_v2/**"
      - "scripts/build_generator_census_fy2024_25.py"
      - "src/kerala2040/generator_census.py"
      - "data/evidence/generation/fy2024_25_generator_capacity_census.json"
      - "configs/public_network_acquisition_v0_1.json"
      - ".github/workflows/public-network-graph-and-sld.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-public-network:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install network, SLD and census dependencies
        run: |
          python -m pip install \
            "shapely>=2.0,<3" \
            "pyproj>=3.6,<4" \
            "pypdf>=5,<7" \
            "fonttools>=4,<5" \
            "pandas>=2.2,<3" \
            "pyarrow>=17,<22" \
            "numpy>=2.0,<3" \
            "pyyaml>=6,<7" \
            "pypsa>=0.31,<2" \
            "highspy>=1.8,<2"

      - name: Acquire public grid layers and SLD PDFs
        run: |
          python scripts/acquire_public_network_sources.py \
            --download-sld \
            --sld-workers 4

      - name: Build geometry-resolved 110 kV+ topology v0.2
        run: python scripts/build_kseb_public_network_graph_v0_2.py

      - name: Mine public SLD text
        run: python scripts/mine_kseb_public_slds.py

      - name: Promote high-confidence SLD transformer evidence
        run: python scripts/promote_kseb_sld_transformers.py

      - name: Build reconciled FY2024-25 generator census
        run: python scripts/build_generator_census_fy2024_25.py

      - name: Crosswalk physical generation to public buses
        run: python scripts/map_generator_census_to_public_grid.py

      - name: Build fail-closed multi-bus skeleton
        run: python scripts/build_kseb_public_multibus_skeleton.py

      - name: Build deterministic PSS 2022-23 110+ grid evidence
        run: python scripts/build_kseb_public_pss_evidence.py

      - name: Build provenance-labelled transport and DC screening inputs
        run: python scripts/build_kseb_transport_screening_inputs.py

      - name: Validate topology, evidence and screening inputs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          graph = json.loads(
              Path("results/network/public_grid_graph_v0_2/network_graph_qa.json").read_text()
          )
          sld = json.loads(
              Path("results/network/public_sld_mining_v0_1/sld_mining_qa.json").read_text()
          )
          transformers = json.loads(
              Path("results/network/public_sld_transformers_v0_1/transformer_evidence_qa.json").read_text()
          )
          generators = json.loads(
              Path("results/network/generator_bus_crosswalk_v0_1/generator_bus_crosswalk_qa.json").read_text()
          )
          multibus = json.loads(
              Path("results/network/public_multibus_skeleton_v0_1/multibus_skeleton_qa.json").read_text()
          )
          pss = json.loads(
              Path("results/network/public_pss_evidence_v0_1/pss_evidence_qa.json").read_text()
          )
          screening = json.loads(
              Path("results/network/public_transport_screening_v0_1/transport_screening_qa.json").read_text()
          )

          assert graph["source_edge_ids_unique"] is True
          assert graph["public_node_ids_unique"] is True
          assert graph["duplicate_public_node_features_collapsed"] >= 2
          assert graph["all_220plus_edges_resolved"] is True
          assert graph["unresolved_admitted_source_edges_by_voltage"] == {}
          assert graph["synthetic_junction_nodes"] >= 8
          assert graph["connected_components_with_edges"] <= 12
          assert graph["largest_component_nodes"] >= 300
          assert graph["split_failures"] == []
          assert graph["power_flow_ready"] is False

          assert sld["inventory_records_valid"] >= 600
          assert sld["pdfs_present"] >= 570
          assert sld["automatic_ocr_used"] is False

          assert transformers["high_confidence_evidence_records"] >= 200
          assert transformers["stations_with_high_confidence_evidence"] >= 100
          assert transformers["automatic_ocr_used"] is False
          assert transformers["equipment_master_ready"] is False
          assert transformers["power_flow_ready"] is False

          assert generators["census_rows"] == 112
          assert abs(generators["census_capacity_mw"] - 4412.156) < 1e-6
          assert generators["physical_rows_attached_to_110plus_network"] >= 25
          assert generators["physical_capacity_attached_to_110plus_network_mw"] >= 2500
          assert generators["aggregate_capacity_attached_to_bus_mw"] == 0
          assert generators["all_aggregate_capacity_left_unallocated"] is True
          assert generators["power_flow_ready"] is False

          assert multibus["physical_site_nodes"] >= 320
          assert multibus["voltage_specific_buses"] >= 460
          assert multibus["topology_line_segments"] >= 550
          assert multibus["structural_transformer_links"] >= 100
          assert multibus["attached_generator_rows"] >= 30
          assert multibus["attached_generator_capacity_mw"] >= 2700
          assert multibus["sites_with_incomplete_transformer_connectivity"] >= 1
          assert multibus["line_segments_with_admitted_thermal_rating"] == 0
          assert multibus["line_segments_with_admitted_impedance"] == 0
          assert multibus["load_rows"] == 0
          assert multibus["bus_ids_unique"] is True
          assert multibus["line_ids_unique"] is True
          assert multibus["transformer_link_ids_unique"] is True
          assert multibus["all_line_bus_references_valid"] is True
          assert multibus["all_transformer_bus_references_valid"] is True
          assert multibus["all_attached_generator_bus_references_valid"] is True
          assert multibus["topology_skeleton_ready"] is True
          assert multibus["transport_dispatch_ready"] is False
          assert multibus["dc_power_flow_ready"] is False
          assert multibus["ac_power_flow_ready"] is False

          assert pss["source_as_of"] == "2023-03-31"
          assert pss["source_transport"] == "FROZEN_INDEXED_OFFICIAL_PDF_SOURCE_SNAPSHOT"
          assert pss["live_network_fetch_used"] is False
          assert pss["snapshot_payload_sha256"] == "02371d67ca850083e29a4a9f53e0f0d5be66b6cc63c7bab158cd1ac6aa4aa4b5"
          assert pss["snapshot_table33_rows"] >= 130
          assert pss["snapshot_table34_rows"] >= 250
          assert pss["graph_feeder_codes_considered"] >= 450
          assert pss["pss_feeder_codes_matched"] >= 250
          assert pss["source_edges_with_conductor_identity"] >= 250
          assert pss["station_transformer_rows_with_reconciled_capacity"] >= 100
          assert pss["stations_mapped"] >= 100
          assert pss["aggregate_transformer_voltage_links_with_capacity"] >= 100

          assert screening["screening_lines"] == multibus["topology_line_segments"]
          assert screening["lines_with_screening_x"] == screening["screening_lines"]
          assert screening["screening_transformer_links"] >= multibus["structural_transformer_links"]
          assert screening["transformer_links_with_pss_2023_capacity"] >= 80
          assert screening["load_buses"] >= 50
          assert abs(screening["load_weight_sum"] - 1.0) < 1e-9
          assert screening["load_proxy_hours"] == 8760
          assert screening["max_hourly_load_conservation_residual_mw"] < 1e-8
          assert screening["bus_ids_unique"] is True
          assert screening["line_ids_unique"] is True
          assert screening["transformer_ids_unique"] is True
          assert screening["all_line_bus_references_valid"] is True
          assert screening["all_transformer_bus_references_valid"] is True
          assert screening["thermal_transport_screening_ready"] is True
          assert screening["dc_screening_inputs_complete"] is True
          assert screening["calibrated_dc_power_flow_ready"] is False
          assert screening["ac_power_flow_ready"] is False
          assert screening["measured_bus_load_telemetry_used"] is False

          print("GRAPH QA")
          print(json.dumps(graph, indent=2))
          print("SLD QA")
          print(json.dumps(sld, indent=2))
          print("TRANSFORMER QA")
          print(json.dumps(transformers, indent=2))
          print("GENERATOR QA")
          print(json.dumps(generators, indent=2))
          print("MULTIBUS QA")
          print(json.dumps(multibus, indent=2))
          print("PSS QA")
          print(json.dumps(pss, indent=2))
          print("SCREENING QA")
          print(json.dumps(screening, indent=2))
          PY

      - name: Run 8760-hour network-constrained DC screening v1.0
        run: |
          python scripts/run_kseb_network_chronological_screening_v1_0.py \
            --hours 8760 \
            --acknowledge-screening-only

      - name: Validate chronological network-screening claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path(
                  "results/network/network_chronological_screening_v1_0/summary.json"
              ).read_text()
          )
          assert summary["hours"] == 8760
          assert summary["full_financial_year"] is True
          assert summary["network"]["buses"] >= 500
          assert summary["network"]["lines"] >= 550
          assert summary["network"]["transformers"] >= 180
          assert summary["network"]["load_buses"] >= 50
          assert summary["network"]["boundary_interfaces"] >= 1
          assert summary["chronology"]["hourly_import_telemetry_measured"] is False
          assert summary["release"]["full_year_network_screening_executed"] is True
          assert summary["release"]["thermal_congestion_screening"] is True
          assert summary["release"]["dc_flow_sensitivity"] is True
          assert summary["release"]["calibrated_dc_power_flow"] is False
          assert summary["release"]["ac_power_flow"] is False
          assert summary["release"]["measured_bus_load_telemetry"] is False
          assert summary["release"]["measured_generator_dispatch"] is False
          assert summary["release"]["measured_interface_dispatch"] is False
          assert summary["release"]["n_minus_1_reliability"] is False
          print("NETWORK CHRONOLOGICAL SCREENING V1.0")
          print(json.dumps(summary, indent=2))
          PY

      - name: Run boundary-allocation bottleneck robustness v1.0
        run: |
          python scripts/run_kseb_network_bottleneck_robustness_v1_0.py \
            --hours 8760 \
            --acknowledge-screening-only

      - name: Validate bottleneck robustness classifications
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          qa = json.loads(
              Path(
                  "results/network/network_bottleneck_robustness_v1_0/"
                  "case_summary.json"
              ).read_text()
          )
          assert qa["hours_per_case"] == 8760
          assert qa["admitted_interface_count"] == 6
          assert qa["case_count"] == 8
          assert qa["case_count"] == qa["expected_case_count"]
          assert qa["all_cases_topology_closed_without_gap_supply"] is True
          assert qa["source_backed_primary_lines_tested"] >= 200
          assert qa["independent_pss_backed_transformers_tested"] >= 30
          assert qa["calibrated_dc_power_flow"] is False
          assert qa["ac_power_flow"] is False
          assert qa["measured_interface_dispatch"] is False
          assert qa["n_minus_1_reliability"] is False
          assert qa["validated_operational_security"] is False
          print("NETWORK BOTTLENECK ROBUSTNESS V1.0")
          print(json.dumps(qa, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kseb-public-network-model-evidence-v0.2
          retention-days: 90
          if-no-files-found: error
          path: |
            results/network/public_grid_graph_v0_2/
            results/network/public_sld_mining_v0_1/
            results/network/public_sld_transformers_v0_1/
            results/network/generator_bus_crosswalk_v0_1/
            results/network/public_multibus_skeleton_v0_1/
            results/network/public_pss_evidence_v0_1/
            results/network/public_transport_screening_v0_1/
            results/network/network_chronological_screening_v1_0/
            results/network/network_bottleneck_robustness_v1_0/
            results/inventory/fy2024_25_generator_census/
            results/acquisition/network_public_v0_1/public_sld_inventory.json
            results/acquisition/network_public_v0_1/acquisition_summary.json
            results/acquisition/network_public_v0_1/geojson/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kseb-public-sld-pdf-archive-v0.2
          retention-days: 30
          if-no-files-found: warn
          path: results/acquisition/network_public_v0_1/sld/

# Public web sources only. No authentication to SOS/TrAMS and no OCR guessing.
# v0.2 resolves only geometry-supported tap/LILO junctions and remains fail-closed
# on ambiguous equipment and distributed generation allocation. Screening ratings,
# reactance and spatial loads are provenance-labelled proxies/assumptions, not calibrated
# operator data. The chronological v1.0 stage is a DC screening sensitivity, not AC or
# calibrated operational security analysis.

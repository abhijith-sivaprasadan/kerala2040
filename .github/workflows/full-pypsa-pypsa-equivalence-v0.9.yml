name: Full PyPSA direct equivalence v0.9

on:
  pull_request:
    paths:
      - "configs/full_pypsa_pypsa_equivalence_v0_9.yaml"
      - "configs/full_pypsa_input_registry.yaml"
      - "data/evidence/models/full_pypsa_pypsa_equivalence_v0_9_2026_09_25.json"
      - "docs/FULL_PYPSA_SCENARIO_PROGRAMME.md"
      - "configs/full_pypsa_proxy_expansion_v0_8.yaml"
      - "configs/full_pypsa_future_adequacy_v0_4.yaml"
      - "configs/full_pypsa_cost_finance_v0_5.yaml"
      - "configs/full_pypsa_era5_renewable_profiles_v0_6.yaml"
      - "configs/full_pypsa_renewable_capacity_v0_7.yaml"
      - "src/kerala2040/full_pypsa_pypsa_equivalence.py"
      - "src/kerala2040/full_pypsa_proxy_expansion.py"
      - "scripts/run_full_pypsa_pypsa_equivalence_v0_9.py"
      - "scripts/build_full_pypsa_era5_profiles_v0_6.py"
      - "tests/test_full_pypsa_pypsa_equivalence_v0_9.py"
      - ".github/workflows/full-pypsa-pypsa-equivalence-v0.9.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  direct-pypsa-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install modelling and ERA5 dependencies
        run: python -m pip install -e ".[dev,era5]"

      - name: Lint and unit-test v0.9
        run: |
          ruff check             src/kerala2040/full_pypsa_pypsa_equivalence.py             scripts/run_full_pypsa_pypsa_equivalence_v0_9.py             tests/test_full_pypsa_pypsa_equivalence_v0_9.py
          pytest -q tests/test_full_pypsa_pypsa_equivalence_v0_9.py

      - name: Download verified Apr-Dec 2024 ERA5 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35622527064"
          pattern: era5-*-2024-*_to_2024-*-SOURCE-UNVALIDATED
          path: results/acquisition/era5/full-year-input/2024
          merge-multiple: false

      - name: Download verified Jan-Mar 2025 ERA5 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "35623051780"
          pattern: era5-*-2025-01_to_2025-03-REACQUIRED-UNVALIDATED
          path: results/acquisition/era5/full-year-input/2025
          merge-multiple: false

      - name: Require exactly 20 independent location-quarter artifacts
        shell: bash
        run: |
          set -euo pipefail
          count="$(find results/acquisition/era5/full-year-input             -type f -name retrieval_attempt.json | wc -l)"
          echo "retrieval manifests: $count"
          test "$count" -eq 20

      - name: Rebuild verified v0.6 renewable profiles
        run: |
          python scripts/build_full_pypsa_era5_profiles_v0_6.py             results/acquisition/era5/full-year-input

      - name: Run full 36-case direct PyPSA equivalence suite
        run: |
          python scripts/run_full_pypsa_pypsa_equivalence_v0_9.py             --acknowledge-equivalence-only             --hours 8760

      - name: Show equivalence summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(
              Path(
                  "results/models/full_pypsa/pypsa_equivalence_v0_9/summary.json"
              ).read_text()
          )
          print("cases_compared:", data["cases_compared"])
          print("all_cases_passed:", data["all_cases_passed"])
          print("maximum_absolute_differences:")
          for key, value in data["maximum_absolute_differences"].items():
              print(" ", key, value)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: full-pypsa-direct-equivalence-v0.9-NOT-VALIDATED-PLAN
          retention-days: 90
          if-no-files-found: error
          path: |
            results/models/full_pypsa/era5_renewables_v0_6/statewide_equal_weight_profile.parquet
            results/models/full_pypsa/pypsa_equivalence_v0_9/summary.json

# Formulation-equivalence QA only. Passing does not validate import economics,
# hydro operation, outages, statutory siting, grid hosting or a capacity plan.

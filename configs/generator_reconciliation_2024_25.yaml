official_commissioned_during_fy:
  - portal_name: Thottiyar HEP
    plant: Thottiyar HEP
    technology: Hydro
    owner: KSEBL
    commissioned_mw: 40.0
    units:
      - {unit: "1", capacity_mw: 10.0, commissioning_date: "2024-07-10"}
      - {unit: "2", capacity_mw: 30.0, commissioning_date: "2024-09-30"}
    sources: [cea_march_2025, economic_review_2025]
    note: "Portal still records 'Ongoing'; CEA records both units as commissioned within FY2024-25."
  - portal_name: Pallivasal Extension Scheme
    plant: Pallivasal Extension Scheme
    technology: Hydro
    owner: KSEBL
    commissioned_mw: 60.0
    units:
      - {unit: "1", capacity_mw: 30.0, commissioning_date: "2024-12-24"}
      - {unit: "2", capacity_mw: 30.0, commissioning_date: "2024-12-24"}
    sources: [cea_march_2025, economic_review_2025]
    note: >-
      CEA gives 24 December 2024 for commissioning of both units; the KSEBL
      annual report describes grid synchronisation on 5 and 24 December 2024.
      Commissioning and synchronisation dates are not silently substituted.

required_for_full_register:
  - "Resolve project portal's 70 captured records against 87 listed items, including completeness and version date."
  - "Obtain KSEBL dated station/unit list and map aliases, old plants and extensions without double-counting."
  - "Recover non-KSEBL/IPPs/CPPs and distributed PV/wind ownership/capacity by the same 2025-03-31 boundary."
  - "Reconcile station-level actual generation by FY2024-25, outages/deratings and retirement status."
  - "Resolve portal kW/MW name-versus-capacity conflicts and absent/non-generating rows."
  - "Separate station-design annual MU from actual measured FY generation and available dispatchable MW."
release_gate: partial_or_provisional

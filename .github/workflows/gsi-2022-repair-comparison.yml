name: Compare GSI 2022 geometry repairs

on:
  pull_request:
    paths:
      - "src/kerala2040/gsi_repair.py"
      - "scripts/compare_gsi_2022_geometry_repairs.py"
      - "scripts/aggregate_gsi_2022_repairs.py"
      - "tests/test_gsi_geometry_repair.py"
      - "data/evidence/gis/official_gis_public_acquisition_2026_09_20.json"
      - "data/evidence/gis/gsi_2022_geometry_validation_2026_09_20.json"
      - ".github/workflows/gsi-2022-repair-comparison.yml"
  push:
    branches: [main]
    paths:
      - "src/kerala2040/gsi_repair.py"
      - "scripts/compare_gsi_2022_geometry_repairs.py"
      - "scripts/aggregate_gsi_2022_repairs.py"
      - "data/evidence/gis/gsi_2022_geometry_validation_2026_09_20.json"
      - ".github/workflows/gsi-2022-repair-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "shapely>=2.1,<3" "pytest>=8,<9" "ruff>=0.7,<1"
      - run: |
          ruff check src/kerala2040/gsi_repair.py scripts/compare_gsi_2022_geometry_repairs.py scripts/aggregate_gsi_2022_repairs.py tests/test_gsi_geometry_repair.py
          pytest -q tests/test_gsi_geometry_repair.py

  district-repair:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        district:
          - Thiruvananthapuram
          - Kollam
          - Pathanamthitta
          - Kottayam
          - Idukki
          - Ernakulam
          - Thrissur
          - Palakkad
          - Malappuram
          - Kozhikode
          - Wayanad
          - Kannur
          - Kasaragod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial comparison stack
        run: pip install "geopandas>=1,<2" "pyogrio>=0.10,<1" "shapely>=2.1,<3" "pyproj>=3.7,<4" "requests>=2.32,<3" "pandas>=2.2,<3"
      - name: Repair and compare one official district source package
        run: |
          python scripts/compare_gsi_2022_geometry_repairs.py \
            --district "${{ matrix.district }}" \
            --output "results/gis/repair_districts/${{ matrix.district }}.json" \
            --gpkg "results/gis/repair_districts/${{ matrix.district }}.gpkg" \
            --raw-dir "results/gis/repair_zips/${{ matrix.district }}"
      - name: Assert district-level scientific boundaries
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          district = os.environ["DISTRICT"]
          a = json.loads(Path(f"results/gis/repair_districts/{district}.json").read_text())
          assert a["districts_processed"] == [district]
          assert a["source_archives"] == 1
          assert a["source_features"] == 3
          assert a["all_source_features_retained"] is True
          assert a["derivative"]["feature_count"] == 3
          assert a["derivative"]["all_valid"] is True
          assert a["alappuzha_hazard_status_inferred"] is False
          assert a["legal_exclusion_interpretation_applied"] is False
          assert a["capacity_ceiling_mw"] is None
          PY
        env:
          DISTRICT: ${{ matrix.district }}
      - uses: actions/upload-artifact@v4
        with:
          name: gsi-repair-${{ matrix.district }}
          path: |
            results/gis/repair_districts/${{ matrix.district }}.json
            results/gis/repair_districts/${{ matrix.district }}.gpkg
          retention-days: 90

  aggregate:
    needs: district-repair
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: gsi-repair-*
          path: results/gis/repair_districts
          merge-multiple: true
      - name: Install aggregation stack
        run: pip install "geopandas>=1,<2" "pyogrio>=0.10,<1" "shapely>=2.1,<3" "pyproj>=3.7,<4" "pandas>=2.2,<3"
      - name: Aggregate 13 independently repaired districts
        run: python scripts/aggregate_gsi_2022_repairs.py
      - name: Assert Kerala repair scope without promoting legal/model use
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("results/gis/gsi_2022_repair_comparison.json").read_text())
          assert a["source_archives"] == 13
          assert a["source_features"] == 39
          assert len(a["districts_processed"]) == 13
          assert a["all_source_features_retained"] is True
          assert a["derivative"]["feature_count"] == 39
          assert a["derivative"]["all_valid"] is True
          assert a["alappuzha_hazard_status_inferred"] is False
          assert a["legal_exclusion_interpretation_applied"] is False
          assert a["technology_specific_hazard_rule_validated"] is False
          assert a["capacity_ceiling_mw"] is None
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gsi-2022-repair-comparison-valid-derivative-NOT-LEGAL-EXCLUSION
          path: |
            results/gis/gsi_2022_repair_comparison.json
            results/gis/gsi_2022_repaired.gpkg
          retention-days: 90

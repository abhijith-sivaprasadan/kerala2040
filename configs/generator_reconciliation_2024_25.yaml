version: 1
classification: official_crosscheck_of_project_portal_not_complete_operating_fleet
snapshot_date: "2025-03-31"
source_scope: "Kerala FY2024-25 in-state installed generation, not contracted imports"
primary_sources:
  economic_review_2025:
    url: https://spb.kerala.gov.in/sites/default/files/2026-01/ER%202025%20Volume1%20Eng%20final.pdf
    locator: "Chapter 11, printed pages 570-572; Table 11.2.4 and major achievements"
    role: "In-state installed capacity and KSEBL-owned vs all-owner boundaries; confirms both projects"
  cea_march_2025:
    url: https://cea.nic.in/wp-content/uploads/installed/2025/03/IC_March_2025_allocation_wise.pdf
    locator: "Final page, projects commissioned during FY2024-25"
    role: "Unit-level Thottiyar and Pallivasal Extension commissioning dates and MW"
  portal:
    url: https://pms.kseb.in/explore-projects
    locator: "Public project explorer (dated tracker label retained in public/kseb-projects.json)"
    role: "Project inventory seed only, not a complete dated operating-fleet register"


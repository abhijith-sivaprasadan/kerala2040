name: api-credentials-smoke-test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api-credentials-smoke-test.yml"

permissions:
  contents: read

jobs:
  data-gov:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify data.gov.in secret is present
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATA_GOV_API_KEY" || { echo "::error::DATA_GOV_API_KEY is missing or empty"; exit 1; }
          echo "DATA_GOV_API_KEY is present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Probe data.gov.in API
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          resource_id = "9ef84268-d588-465a-a308-a864a43d0070"
          url = f"https://api.data.gov.in/resource/{resource_id}"
          params = {
              "api-key": os.environ["DATA_GOV_API_KEY"],
              "format": "json",
              "offset": 0,
              "limit": 1,
          }

          last_error = None
          for attempt in range(1, 4):
              try:
                  r = requests.get(url, params=params, timeout=(10, 25))
                  r.raise_for_status()
                  payload = r.json()
                  if not isinstance(payload, dict):
                      raise RuntimeError("Unexpected response type from data.gov.in")
                  if payload.get("error"):
                      raise RuntimeError(f"data.gov.in returned an API error: {payload['error']}")
                  records = payload.get("records")
                  if not isinstance(records, list) or len(records) < 1:
                      raise RuntimeError("data.gov.in returned no records for the smoke-test resource")
                  print("data.gov.in API probe OK")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Attempt {attempt}/3 failed: {type(exc).__name__}: {exc}")
                  if attempt < 3:
                      time.sleep(5 * attempt)
          else:
              raise RuntimeError(
                  "data.gov.in probe failed after 3 attempts. "
                  f"Last error: {type(last_error).__name__}: {last_error}"
              )
          PY

  cds:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify CDS secret is present
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CDSAPI_KEY" || { echo "::error::CDSAPI_KEY is missing or empty"; exit 1; }
          echo "CDSAPI_KEY is present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cdsapi
        run: python -m pip install --disable-pip-version-check "cdsapi>=0.7.7"

      - name: Probe Copernicus CDS token with tiny ERA5 request
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import cdsapi

          target = Path("era5-probe.nc")
          client = cdsapi.Client(
              url=os.environ["CDSAPI_URL"],
              key=os.environ["CDSAPI_KEY"],
              quiet=True,
              progress=False,
              timeout=120,
              sleep_max=15,
              retry_max=10,
          )
          client.retrieve(
              "reanalysis-era5-single-levels",
              {
                  "product_type": ["reanalysis"],
                  "variable": ["2m_temperature"],
                  "year": ["2024"],
                  "month": ["01"],
                  "day": ["01"],
                  "time": ["00:00"],
                  "data_format": "netcdf",
                  "download_format": "unarchived",
                  "area": [10.25, 76.00, 10.00, 76.25],
              },
              str(target),
          )
          if not target.exists() or target.stat().st_size == 0:
              raise RuntimeError("CDS request completed without a non-empty file")
          print(f"Copernicus CDS ERA5 probe OK: {target.stat().st_size} bytes")
          PY

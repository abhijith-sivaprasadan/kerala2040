name: gis-acquisition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "configs/gis_inputs.yaml"
      - "scripts/download_gis_inputs.py"
      - "scripts/prepare_gis_manifest.py"
      - ".github/workflows/gis-acquisition.yml"

permissions:
  contents: read

jobs:
  public-gis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Download directly accessible official GIS inputs
        run: python scripts/download_gis_inputs.py
      - name: Build local GIS presence/hash manifest
        run: python scripts/prepare_gis_manifest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kerala2040-public-gis-raw
          retention-days: 14
          path: |
            data/external/gis/**
            results/gis/**

version: 1
classification: unresolved
source_type: gis_catalogue_only
source: Official agencies listed per layer
note: Catalogue entries are not model-ready GIS data.
rule: >-
  A catalogue link is not a processed constraint. A layer becomes model-ready only after
  its raw file, hash, CRS, vintage, licence/access condition and processing rule are recorded.

layers:
  ksdma_flood_historic_10_25_50:
    source: Kerala State Disaster Management Authority
    url: https://sdma.kerala.gov.in/wp-content/uploads/2026/06/1.-Flood-Return-Probability-Historical-10-25-50-years.zip
    expected_format: raster_zip
    raw_path: data/external/gis/ksdma/flood_historic_10_25_50.zip
    role: hazard_constraint
    acquisition_status: not_downloaded_in_repository
  ksdma_flood_historic_100_200_500:
    source: Kerala State Disaster Management Authority
    url: https://sdma.kerala.gov.in/wp-content/uploads/2026/06/2.Flood-Return-Probability-Historical-100-200-500-years.zip
    expected_format: raster_zip
    raw_path: data/external/gis/ksdma/flood_historic_100_200_500.zip
    role: hazard_constraint
    acquisition_status: not_downloaded_in_repository
  ksdma_flood_rcp85_10_25_50:
    source: Kerala State Disaster Management Authority
    url: https://sdma.kerala.gov.in/wp-content/uploads/2026/06/3.-Flood-Return-Probability-RCP8.5-10-25-50-years.zip
    expected_format: raster_zip
    raw_path: data/external/gis/ksdma/flood_rcp85_10_25_50.zip
    role: climate_hazard_constraint
    acquisition_status: not_downloaded_in_repository
  ksdma_flood_rcp85_100_200_500:
    source: Kerala State Disaster Management Authority
    url: https://sdma.kerala.gov.in/wp-content/uploads/2026/06/4.Flood-Return-Probability-RCP8.5-100-200-500-years.zip
    expected_format: raster_zip
    raw_path: data/external/gis/ksdma/flood_rcp85_100_200_500.zip
    role: climate_hazard_constraint
    acquisition_status: not_downloaded_in_repository
  ksdma_landslide:
    source: Kerala State Disaster Management Authority / Geological Survey of India
    landing_page: https://sdma.kerala.gov.in/hazard-maps/
    acquisition_register: configs/gis_forest_dem_wetlands_hazards_2026.yaml
    report: docs/FOREST_DEM_WETLANDS_LANDSLIDE_GIS_AUDIT.md
    expected_format: gsi_2022_district_shapefile_zip_plus_class_legend
    raw_path: data/external/gis/ksdma/landslide
    role: susceptibility_penalty_or_avoidance_not_universal_statutory_exclusion
    acquisition_status: official_download_listed_but_not_committed_verified
    note: >-
      KSDMA lists 13 GSI 2022 district shapefile links, excluding Alappuzha;
      do not infer hazard-free missing coverage. Old NCESS map superseded.
      The source list does not establish downloaded ZIPs or GIS validity.
  kerala_forest_protected_areas:
    source: Kerala Forest and Wildlife Department
    landing_page: https://forest.kerala.gov.in/
    acquisition_register: configs/gis_forest_dem_wetlands_hazards_2026.yaml
    report: docs/FOREST_DEM_WETLANDS_LANDSLIDE_GIS_AUDIT.md
    expected_format: notified_vector_plus_gazette_identity
    raw_path: data/external/gis/forest/protected_areas
    role: legal_ecological_exclusion_only_after_verified_notification
    acquisition_status: official_internal_gis_reported_geometry_not_secured
    note: >-
      Department reports digitised forest and protected-area boundaries; public
      authoritative original georeferenced file, notification linkage, effective
      date and redistribution terms not acquired. Forest cover != legal forest.
  bhuvan_lulc:
    source: NRSC/ISRO Bhuvan
    landing_page: https://bhuvan-app1.nrsc.gov.in/2dresources/bhuvanstore2.php
    official_2024_25_visual_layer: https://bhuvan-app1.nrsc.gov.in/moef/
    native_acquisition_policy: https://www.isro.gov.in/SpaceBasedEarthObservationServices.html
    acquisition_register: configs/lulc_native_acquisition_2024_25.yaml
    report: docs/NRSC_LULC_NATIVE_ACQUISITION_AUDIT.md
    desired_vintage: "2024-25"
    desired_scale_denominator: 250000
    expected_format: native_class_coded_geotiff_or_vector_plus_original_legend
    raw_path: data/external/gis/bhuvan/lulc
    role: historical_land_use_context_not_legal_exclusion
    acquisition_status: not_downloaded_native_data_requires_approved_route
    note: >-
      2024-25 appears in the Bhuvan map selector; a native Kerala dataset,
      class legend, CRS and licence have NOT been acquired. Store's download
      table lists LULC250K through 2022-23. WMS visual pixels are not class IDs;
      ISRO describes native 250K data requests via a signed institutional MoU.
      SISDP 10K district availability requires separate confirmation.
  bhuvan_dem:
    source: NRSC/ISRO Bhuvan and Copernicus Programme
    landing_page: https://bhuvan-app3.nrsc.gov.in/data/download/help/source/html/steps_to_download_data.htm
    public_alternative: https://registry.opendata.aws/copernicus-dem/
    acquisition_register: configs/gis_forest_dem_wetlands_hazards_2026.yaml
    report: docs/FOREST_DEM_WETLANDS_LANDSLIDE_GIS_AUDIT.md
    expected_format: source_height_cog_or_cartodem_tiles_with_vertical_datum
    raw_path: data/external/gis/terrain
    role: slope_terrain_input_not_legal_eligibility
    acquisition_status: verified_NWIC_boundary_native_pixel_DSM_coverage_and_descriptive_slope_NOT_DTM_or_eligibility
    original_tile_acquisition_evidence: data/evidence/gis/copernicus_glo90_envelope_2026_09_20.json
    original_tile_qa_run: https://github.com/abhijith-sivaprasadan/kerala2040/actions/runs/35515526369
    original_nwic_boundary_source_evidence: data/evidence/gis/nwic_kerala_boundary_dem_tile_intersections_2026_09_20.json
    note: >-
      Fourteen hashed Copernicus GLO90 originals and a partial DSM mosaic
      are acquired. An original NWIC state polygon in EPSG:7755 was reprojected;
      none of six unpublished envelope-tile footprints intersects Kerala,
      and source-grid pixel-centre finite height coverage now passes on the exact
      NWIC boundary (4,624,362 of 4,624,362). The projected 90 m DSM still has
      2,596 non-finite boundary pixels; surface slope is descriptive only.
      Subpixel coastline, bare-earth terrain, boundary precision and technology-
      specific slope eligibility remain unverified.
      CartoDEM still requires Bhuvan access; no siting capacity asserted.
  bhuvan_waterbodies:
    source: State Wetland Authority Kerala / NRSC ISRO
    landing_page: https://envt.kerala.gov.in/state-wetland-authority-kerala-swak/
    source_atlas: https://vedas.sac.gov.in/en/National_Wetland_Inventory_and_Assessment_%28NWIA%29_Atlas.html
    acquisition_register: configs/gis_forest_dem_wetlands_hazards_2026.yaml
    report: docs/FOREST_DEM_WETLANDS_LANDSLIDE_GIS_AUDIT.md
    expected_format: official_georeferenced_inventory_plus_final_notifications
    raw_path: data/external/gis/wetlands
    role: wetland_protection_and_waterbody_screening
    acquisition_status: draft_notified_legal_distinction_original_geometry_not_secured
    note: >-
      NWIA atlas is not an official current legal geometry; SWAK draft briefs
      and WIAMS portal are not final notification polygons. Keep all separate.
  kerala_lris_land_resources:
    source: Kerala Land Use Department / LRIS 2.0
    landing_page: https://lris.kslub.kerala.gov.in/app/
    data_access_faq: https://kslub.kerala.gov.in/?page_id=371&lang=en
    source_discovery: docs/LRIS_NIWE_KMML_SOURCE_DISCOVERY_2026_09_21.md
    expected_format: native_class_coded_vector_or_raster_plus_legend_and_reuse_permission
    raw_path: data/external/gis/lris
    role: complementary_local_land_use_paddy_wetland_soil_drainage_screening
    acquisition_status: request_letter_and_possible_fee_required_no_native_files_acquired
    note: >-
      Portal renders local-area thematic overlays, not verified downloadable
      native GIS data. Official FAQ requests a purpose-specific letter to the
      Land Use Commissioner and describes payment at government-fixed rates.
      Request full statewide scope or named district/localbody subsets, dates,
      class IDs, CRS, scale, geometry and terms. The mapped Forest/Wetlands
      class is NOT gazette-linked legal protected-area/wetland geometry and
      is not a replacement for FY2024-25 NRSC native LULC.

  global_solar_atlas_india_lta:
    source: Global Solar Atlas 2.0 / Solargis / World Bank ESMAP
    landing_page: https://globalsolaratlas.info/download/india
    source_batch: docs/SOLAR_WIND_SOURCE_BATCH_2026_09_21.md
    original_sha_manifest: data/evidence/solar/solar_batch_2026_09_21_originals_manifest.json
    original_archive_names:
      - India_GISdata_LTAym_YearlyMonthlyTotals_GlobalSolarAtlas-v2_AAIGRID.zip
      - India_GISdata_LTAym_AvgDailyTotals_GlobalSolarAtlas-v2_AAIGRID.zip
    expected_format: native_ascii_grid_lta_year_month_and_daily_with_prj_pdf_xml_metadata
    raw_path: data/external/raw/solar/source_2026_09_21
    role: spatial_long_term_solar_climatology_not_FY2024_25_hourly_generation
    acquisition_status: user_supplied_originals_sha256_pinned_LOCAL_ONLY_NOT_YET_GITHUB_RELEASE
    note: >-
      Two original India GIS ZIPs received and hash-pinned; their 97 members
      apiece are inventoried, NOT yet completely raster-validated or clipped
      to Kerala. Includes GHI, DNI, DIF, GTI, TEMP, OPTA, PVOUT and
      monthly PVOUT in different long-term average conventions. Do not
      mistake long-term averages for FY2024-25 hourly observations.
      GitHub release asset upload and public-redistribution review pending;
      do not claim permanent repository archival before remote verification.
  global_pv_potential_study_derived_2020:
    source: World Bank / ESMAP / Solargis
    landing_page: https://globalsolaratlas.info/global-pv-potential-study
    source_batch: docs/SOLAR_WIND_SOURCE_BATCH_2026_09_21.md
    original_sha_manifest: data/evidence/solar/solar_batch_2026_09_21_originals_manifest.json
    source_qa: data/evidence/solar/global_pv_derived_source_qa_2026_09_21.json
    original_archive_names:
      - global-PVRASTER-DATA-LAYERS--GlobalSol derived 1(1).zip
      - global-PVRASTER-DATA-LAYERS--GlobalSol derived 2(1).zip
    expected_format: global_EPSG4326_30_arcsecond_GeoTIFFs_plus_original_README
    raw_path: data/external/raw/solar/source_2026_09_21
    role: historic_global_study_sensitivity_and_spatial_crosscheck_not_Kerala_legal_siting_or_2026_LCOE
    acquisition_status: user_supplied_2_ZIPs_SHA256_and_ZIP_CRC_verified_LOCAL_ONLY_NOT_GITHUB_BINARY_ARCHIVED
    note: >-
      2020 World Bank ESMAP/Solargis global PV study. Original TIFFs:
      PVOUT_level1, PVOUT_level2, seasonality index, simplified
      25-year LCOE. Raster CRS EPSG:4326 at 30 arcsecond resolution.
      Level 1/2 are global-study physical and soft land-use screens
      and are NOT authoritative Kerala legal exclusions or installable MW.
      The historic LCOE is NOT current Kerala/2040 project economics.
      Ten original source archives/files are registered for checksum-gated
      GitHub Release upload; binaries have NOT yet been uploaded.
  global_pv_2020_screening_masks:
    source: World Bank / ESMAP / Solargis
    landing_page: https://globalsolaratlas.info/global-pv-potential-study
    source_batch: docs/SOLAR_WIND_SOURCE_BATCH_2026_09_21.md
    source_qa: data/evidence/solar/solar_batch_3_2026_09_21_source_qa.json
    original_sha_manifest: data/evidence/solar/solar_batch_2026_09_21_originals_manifest.json
    original_archive_name: global-PV-RASTER-DATA-LAYERS--GlobalSol masks(1).zip
    expected_format: original_global_binary_GeoTIFF_masks_plus_README
    raw_path: data/external/raw/solar/source_2026_09_21
    role: World_Bank_2020_global_study_screening_comparison_NOT_Kerala_statutory_exclusions
    acquisition_status: original_ZIP_user_supplied_SHA256_CRC_and_inner_TIFF_hashes_passed_NOT_GitHub_binary_archived
    note: >-
      Ten original global masks: physical/terrain, forest, cropland, water
      and population proxies, IUCN-status protected-area proxy and study
      composites MASK_level1 and MASK_level2. At 30 arcsecond EPSG:4326,
      composite and component rasters have different latitudinal coverage.
      Study mask classes 0/1 need publisher-method interpretation.
      No mask is a notified current Kerala forest, wetland or land-use
      exclusion. Preserve masks' original World Bank CC BY README and
      additional licence wording. Source archive remains local, NOT in
      GitHub releases.
  global_solar_atlas_india_monthly_pvout_geotiff:
    source: Global Solar Atlas 2.0 / Solargis / World Bank ESMAP
    landing_page: https://globalsolaratlas.info/download/india
    source_batch: docs/SOLAR_WIND_SOURCE_BATCH_2026_09_21.md
    source_qa: data/evidence/solar/solar_batch_3_2026_09_21_source_qa.json
    original_sha_manifest: data/evidence/solar/solar_batch_2026_09_21_originals_manifest.json
    original_archive_name: monthlyIndia_GISdata_LTAy_YearlyMonthlyTotals_GlobalSolarAtla(1).zip
    expected_format: 12_native_GeoTIFF_PVOUT_months_with_ISO19139_PDF_XML_and_aux_metadata
    raw_path: data/external/raw/solar/source_2026_09_21
    role: 1999_2018_long_term_monthly_PV_yield_climatology_NOT_FY2024_25_hourly_generation
    acquisition_status: original_ZIP_user_supplied_SHA256_CRC_and_inner_TIFF_hashes_passed_NOT_GitHub_binary_archived
    note: >-
      PVOUT_01..12 TIFF monthly averages in kWh/kWp per named calendar
      month, 1999-2018, not daily yield or FY2024-25 observed output.
      Original EPSG:4326 India 30 arcsecond rasters, 3840x3840,
      full sidecar PDF/XML preserved inside ZIP. Analogous science
      source to previously acquired AAIGRID monthly products, not
      an independent measured time series. Needs Kerala clip and QA.
  global_solar_atlas_india_annual_geotiff:
    source: Global Solar Atlas 2.0 / Solargis / World Bank ESMAP
    landing_page: https://globalsolaratlas.info/download/india
    source_batch: docs/SOLAR_WIND_SOURCE_BATCH_2026_09_21.md
    source_qa: data/evidence/solar/solar_batch_3_2026_09_21_source_qa.json
    original_sha_manifest: data/evidence/solar/solar_batch_2026_09_21_originals_manifest.json
    original_archive_names:
      - New folder(1).zip
      - New folder (2)(1).zip
    expected_format: seven_India_GeoTIFFs_and_original_ISO19139_sidecars_split_across_two_user_packaged_ZIPs
    raw_path: data/external/raw/solar/source_2026_09_21
    role: long_term_annual_GHI_DNI_DIF_GTI_PVOUT_temperature_tilt_NOT_observed_2024_25
    acquisition_status: seven_TIFFs_hash_and_ZIP_CRC_passed_NOT_GitHub_binary_archived
    note: >-
      Two user-packaged ZIPs jointly contain seven original GSA TIFFs:
      DIF,GHI,OPTA,TEMP and DNI,GTI,PVOUT. Original metadata sidecars
      in first ZIP describe both groups. EPSG:4326, 9 arcsecond for
      irradiation, 30 arcsecond PVOUT and TEMP, 120 arcsecond OPTA.
      Irradiation and PVOUT reference 1999-2018; TEMP 1994-2018.
      Annual totals are not FY2024-25 hourly chronology or PV
      measurements. Underlying source overlaps prior AAIGRID
      equivalents and is not independent model validation.
  global_solar_atlas_india_avg_daily_geotiff:
    source: Global Solar Atlas 2.0 / Solargis / World Bank ESMAP
    landing_page: https://globalsolaratlas.info/download/india
    source_batch: docs/SOLAR_WIND_SOURCE_BATCH_2026_09_21.md
    source_qa: data/evidence/solar/solar_batch_4_2026_09_21_avg_daily_geotiff_qa.json
    original_sha_manifest: data/evidence/solar/solar_batch_2026_09_21_originals_manifest.json
    original_archive_names:
      - monthlyIndia_GISdata_LTAy_AvgDailyTotals_GlobalSolarAtlas-v2_GEOTIFF(1).zip
      - India_GISdata_LTAy_AvgDailyTotals_GlobalSolarAtlas-v2_GEOTIFF2(1).zip
      - India_GISdata_LTAy_AvgDailyTotals_GlobalSolarAtlas-v2_GEOTIFF.zip
    expected_format: 12_monthly_and_7_yearly_AvgDaily_GeoTIFFs_with_ISO19139_sidecars_split_in_3_original_ZIPs
    raw_path: data/external/raw/solar/source_2026_09_21
    role: long_term_daily_average_solar_PV_climatology_not_FY2024_25_measured_hourly_PV
    acquisition_status: three_user_supplied_original_ZIPs_SHA256_CRC_inner_TIFF_hashes_verified_NOT_GitHub_binary_archived
    note: >-
      Three original 2019 GSA 2.0 India avg-daily GeoTIFF ZIPs hold
      PVOUT_01-12 and the seven India yearly-average layer names
      DIF,DNI,GHI,GTI,PVOUT,OPTA,TEMP. Filename "AvgDailyTotals" and
      sampled magnitudes imply per-day units for irradiation/PVOUT;
      embedded XML says "monthly/yearly average in kWh" WITHOUT
      explicit /day, so verify normalization against corresponding
      previously acquired monthly/yearly-total raster cells before
      model-facing use. OPTA.tif and TEMP.tif are byte-identical to
      previously acquired full-year TIFFs. Long-term irradiation/PVOUT
      source period 1999-2018, TEMP 1994-2018, NOT FY2024-25.
      Original binary archives still need GitHub Release upload.
  nwic_kerala_solar_wind_station_observations:
    source: NWIC National Water Data Portal / Kerala Surface Water Department
    solar_landing_page: https://nwdp.nwic.gov.in/dataset/solar-radiation-telemetry-hourly-kerala-surface-water-department
    wind_landing_page: https://nwdp.nwic.gov.in/dataset/wind-speed-telemetry-hourly-kerala-surface-water-department
    source_batch: docs/SOLAR_WIND_SOURCE_BATCH_2026_09_21.md
    original_sha_manifest: data/evidence/solar/solar_batch_2026_09_21_originals_manifest.json
    expected_format: original_provider_station_CSVs_nested_in_Solar_ZIP
    raw_path: data/external/raw/solar/source_2026_09_21/Solar.zip
    role: pointwise_weather_validation_not_statewide_weather_or_generation
    acquisition_status: user_supplied_csv_in_original_zip_LOCAL_ONLY_partial_FY2024_25
    note: >-
      Original NWIC solar and wind CSV files reside inside Solar.zip.
      FY2024-25 has only 6007 solar observations and 10946 wind
      observations across Ambalapuzha and Kulamavu, concentrated
      May-Oct 2024 plus March 2025. Units are W/m2 for solar and
      km/h for wind. Sensor height and time zone not yet established.
      Raw original source is not yet uploaded to GitHub release.
  niwe_wind_atlas_150m:
    source: National Institute of Wind Energy
    landing_page: https://niwe.res.in/Open_data_Set/open_wind_dataset/
    exact_dataset_page: https://niwe.res.in/Open_data_Set/open_wind_dataset/11/
    visualization: https://maps.niwe.res.in/resource_map/map/150m/
    source_discovery: docs/LRIS_NIWE_KMML_SOURCE_DISCOVERY_2026_09_21.md
    expected_format: original_national_zip_with_csv_500m_grid_at_150m_height
    advertised_archive_name: 150m_Map_Data_A_to_G.zip
    advertised_unpacked_file_name: 150m_Map_Data_A_to_G.csv
    source_qa: data/evidence/gis/niwe_150m_user_supplied_source_qa_2026_09_21.json
    raw_path: data/external/gis/niwe/wind_atlas_150m
    role: wind_resource_potential_climatology_not_hourly_generation
    acquisition_status: user_supplied_original_NIWE_ZIP_hash_verified_full_CSV_QA_passed_NOT_repo_stored_NOT_Kerala_clipped
    access_note: >-
      User supplied Wind.zip with nested original NIWE national ZIP; original
      hashes recorded, full 19,475,568-row seven-column CSV parsed without
      missing/non-numeric fields. Height 150m; nominal grid 500m. Metadata
      advertises wind direction/temperature/pressure/joint-frequency, but
      ACTUAL CSV DOES NOT CONTAIN THESE FIELDS OR CUF. National source is
      spatial climatology without a measurement period, not FY2024-25 hourly
      generation. User's original archive has not been committed or uploaded
      to GitHub. Reacquire official original when needed, verify research-use
      permissions before redistribution, confirm CRS/vintage, and clip to
      hash-verified NWIC Kerala polygon. Bounding box containing Tamil Nadu
      and Karnataka must not be called Kerala. No installable MW inferred.
  western_ghats_esa:
    source: Ministry of Environment Forest and Climate Change
    landing_page: https://www.moef.gov.in/esa-notifications
    expected_format: authoritative_vector_or_georeferenced_schedule
    raw_path: data/external/gis/moefcc/western_ghats_esa
    role: legal_policy_constraint
    acquisition_status: current_authoritative_geometry_not_yet_secured
    legal_status_rule: preserve notification date and draft/final status

processing_contract:
  target_crs: EPSG:32643
  required_metadata:
    - source_url
    - retrieved_at_utc
    - sha256
    - source_vintage
    - source_crs
    - licence_or_access_condition
    - processing_steps
  outputs:
    exclusions: data/processed/gis/exclusions.gpkg
    renewable_eligibility: data/processed/gis/renewable_eligibility.gpkg
    capacity_ceiling_summary: results/gis/capacity_ceiling_summary.json
  model_rule: >-
    No GIS-derived capacity ceiling is valid until raw and processed provenance are complete.

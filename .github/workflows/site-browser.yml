name: Browser-level site smoke
on:
  push:
    paths:
      - 'docs/**'
      - 'scripts/build_site.py'
      - 'src/kerala2040/audit_readiness.py'
      - 'src/kerala2040/research_ledger.py'
      - 'tests/site.browser.cjs'
      - '.github/workflows/site-browser.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/build_site.py'
      - 'src/kerala2040/audit_readiness.py'
      - 'src/kerala2040/research_ledger.py'
      - 'tests/site.browser.cjs'
      - '.github/workflows/site-browser.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site builder and browser
        run: |
          python -m pip install 'pyyaml>=6,<7' 'cairosvg>=2.7,<3'
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Build release snapshot and exercise Chromium
        env:
          PYTHONPATH: src
          KERALA_RESEARCH_SHA: ${{ github.sha }}
        run: |
          python scripts/build_site.py --output _site
          node tests/site.browser.cjs _site
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kerala2040-browser-smoke-${{ github.run_id }}
          path: /tmp/kerala2040-browser-qa/
          if-no-files-found: ignore
          retention-days: 7

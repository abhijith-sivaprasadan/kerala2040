name: Recover missing ERA5 FY2024-25 quarter

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/era5-quarter-recovery.yml"
      - "scripts/ingest_era5_points.py"
      - "src/kerala2040/sources/era5.py"
  workflow_dispatch:

permissions:
  contents: read

# One independent artifact per location and quarter: a slow/failed CDS request
# must not discard four other locations' evidence. Limit concurrent CDS jobs to
# avoid overwhelming a single account's request quota.
jobs:
  source-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        quarter: [2024-04_to_2024-06, 2024-07_to_2024-09, 2024-10_to_2024-12]
        point: [thiruvananthapuram, kochi, palakkad, kozhikode, kannur]
    env:
      CDSAPI_URL: https://cds.climate.copernicus.eu/api
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Copernicus source-reader dependencies
        run: python -m pip install "cdsapi>=0.7.7,<1" "numpy>=2,<3" "pandas>=2.2,<3" "beautifulsoup4>=4.12,<5"
      - name: Retrieve one bounded location-quarter into review-only artifact
        env:
          PYTHONPATH: src
          QUARTER: ${{ matrix.quarter }}
          POINT: ${{ matrix.point }}
        run: |
          python scripts/ingest_era5_points.py \
            --points "$POINT" \
            --periods "$QUARTER" \
            --max-requests 1 \
            --raw-dir results/acquisition/era5/source_files \
            --manifest results/acquisition/era5/retrieval_attempt.json
      - name: Preserve original NetCDFs, per-file hashes and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: era5-${{ matrix.point }}-${{ matrix.quarter }}-SOURCE-UNVALIDATED
          retention-days: 90
          if-no-files-found: warn
          path: results/acquisition/era5/

# No public manifest / website mutation. New source bytes must be inspected
# (hours, variables, units, spatial coordinates and SHA-256) before admission.

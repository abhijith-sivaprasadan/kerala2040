version: 1
classification: reconciled_structural_base_not_dispatch_ready
base_date: "2026-03-31"
timezone: Asia/Kolkata
purpose: >-
  Canonical physical starting boundary for the full Kerala2040 PyPSA programme.
  This file reconciles official capacity-accounting populations at one date.
  It is not yet a dispatch-ready network because chronology, costs, unit
  availability, hydro physics and several asset-level decompositions remain blocked.

